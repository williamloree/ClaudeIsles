<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Water } from 'three/addons/objects/Water.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- Données de démonstration ----------
const AGENTS = [
  { title: 'Revue du module facturation', type: 'general-purpose', status: 'running', activity: 'Read lib/calcul.styx', tools: 23, time: '2 min 14' },
  { title: 'Explorer le dépôt BDDStyx', type: 'Explore', status: 'running', activity: 'Grep "ID_RESTITUTION"', tools: 41, time: '4 min 02' },
  { title: 'Mettre à jour le README', type: 'tâche · sonnet', status: 'completed', activity: 'Edit README.md', tools: 12, time: '1 min 30' },
  { title: 'Lancer les tests', type: 'general-purpose', status: 'failed', activity: 'PS> npm test', tools: 7, time: '0 min 48' },
];
const SHELLS = [
  { cmd: 'npm run dev', lines: ['VITE v8.3.8  ready in 412 ms', '➜ Local: http://localhost:5181/', '[hmr] src/App.tsx mis à jour', '[hmr] src/styles.css mis à jour'] },
  { cmd: 'python -I scripts/doc/regenerer.py', lines: ['Lecture de knowledge.py…', '562 tables, 676 liaisons', 'Écriture 02 - Tables/… 398/562', 'Écriture 02 - Tables/… 451/562'] },
  { cmd: 'git log --oneline -n 20', lines: ['a3f9c1e Corrige le calcul TEOM', '91b2d04 Ajoute la doc des ponts', '77e0a1c Renomme les dossiers'] },
];
// Couleur du feu de chaque îlot = statut de son agent.
const STATUS = { running: ['en cours', '#6fd6ff'], completed: ['terminé', '#ffc94d'], failed: ['échec', '#ff4a3d'] };

await Promise.all([document.fonts.load('700 30px Cinzel'), document.fonts.load('600 20px "JetBrains Mono"')]).catch(() => {});

// ---------- Moteur ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
labelRenderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030607);
scene.fog = new THREE.FogExp2(0x061012, 0.0105);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.3, 2000);
camera.position.set(-18, 26, 78);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.maxPolarAngle = Math.PI * 0.47;

scene.add(new THREE.AmbientLight(0x1d2f33, 0.6));
scene.add(new THREE.HemisphereLight(0x2f5a5c, 0x050505, 0.5));
const moon = new THREE.DirectionalLight(0x7fb7c4, 0.7); // lueur verdâtre venue d'une faille de la voûte
moon.position.set(-40, 90, -30); moon.castShadow = true; moon.shadow.mapSize.set(1024, 1024);
Object.assign(moon.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 300 });
scene.add(moon);

// ---------- Outils ----------
const noise = new ImprovedNoise();
const fbm = (x, y, z, oct = 4) => { let a = 0.5, f = 1, s = 0; for (let i = 0; i < oct; i++) { s += a * noise.noise(x * f, y * f, z * f); a *= 0.5; f *= 2; } return s; };
const pnoise = (u, v, s, o = 4) => fbm(Math.cos(u * 6.283) * s, Math.sin(u * 6.283) * s, Math.cos(v * 6.283) * s + Math.sin(v * 6.283) * s * 0.5 + 3.7, o);
function canvasTexture(size, paint, repeat = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size; const ctx = c.getContext('2d'); const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) { const [r, g, b] = paint(x / size, y / size); const i = (y * size + x) * 4; img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255; }
  ctx.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = 8; return t;
}
const basaltTex = canvasTexture(256, (u, v) => { const n = pnoise(u, v, 3) * 0.7 + pnoise(u, v, 14, 2) * 0.3; const k = 38 + n * 40; return [k, k * 1.02, k * 1.05]; }, 3);
const marbleTex = canvasTexture(256, (u, v) => { const vein = Math.abs(Math.sin((u * 3 + v * 2 + pnoise(u, v, 2.5) * 2.2) * Math.PI)); const k = 170 + Math.pow(vein, 0.25) * 55 + pnoise(u, v, 10, 2) * 20; return [k, k * 0.97, k * 0.9]; }, 2);
const basalt = new THREE.MeshStandardMaterial({ map: basaltTex, roughness: 0.95 });
const marble = new THREE.MeshStandardMaterial({ map: marbleTex, roughness: 0.45 });
const bronze = new THREE.MeshStandardMaterial({ color: 0x7a5528, metalness: 0.85, roughness: 0.4 });
const cypressMat = new THREE.MeshStandardMaterial({ color: 0x0d1f16, roughness: 1 });
const shadow = (o) => { o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };

// ---------- Le Styx ----------
const waterNormals = (() => {
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N; const ctx = c.getContext('2d'); const img = ctx.createImageData(N, N);
  const waves = Array.from({ length: 14 }, (_, i) => ({ kx: Math.round(Math.cos(i * 2.4) * (2 + i)), ky: Math.round(Math.sin(i * 2.4) * (2 + i)), a: 1 / (2 + i), p: i * 1.7 }));
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let dx = 0, dy = 0; for (const w of waves) { const c2 = Math.cos(2 * Math.PI * (w.kx * x + w.ky * y) / N + w.p) * w.a; dx += c2 * w.kx; dy += c2 * w.ky; }
    const n = new THREE.Vector3(-dx * 0.08, -dy * 0.08, 1).normalize(); const i = (y * N + x) * 4;
    img.data[i] = (n.x * 0.5 + 0.5) * 255; img.data[i + 1] = (n.y * 0.5 + 0.5) * 255; img.data[i + 2] = (n.z * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
})();
const water = new Water(new THREE.PlaneGeometry(3000, 3000), {
  textureWidth: 512, textureHeight: 512, waterNormals, sunDirection: new THREE.Vector3(-0.4, 0.9, -0.3).normalize(), sunColor: 0x4fa892, waterColor: 0x02110e, distortionScale: 1.6, fog: true,
});
water.rotation.x = -Math.PI / 2; scene.add(water);

// Voûte de la caverne : stalactites, piliers de roche au loin.
const cave = new THREE.Group();
for (let i = 0; i < 260; i++) {
  const a = Math.random() * Math.PI * 2, r = 20 + Math.random() * 260, h = 8 + Math.random() * 30;
  const s = new THREE.Mesh(new THREE.ConeGeometry(1 + Math.random() * 3, h, 7), basalt); s.rotation.x = Math.PI; s.position.set(Math.cos(a) * r, 95 - h / 2 + Math.random() * 10, Math.sin(a) * r); cave.add(s);
}
for (let i = 0; i < 28; i++) {
  const a = (i / 28) * Math.PI * 2 + Math.random() * 0.1, r = 170 + Math.random() * 90;
  const geo = new THREE.CylinderGeometry(8 + Math.random() * 10, 14 + Math.random() * 14, 140, 12, 10); const p = geo.attributes.position;
  for (let j = 0; j < p.count; j++) { const k = 1 + fbm(p.getX(j) * 0.08, p.getY(j) * 0.05, i) * 0.6; p.setX(j, p.getX(j) * k); p.setZ(j, p.getZ(j) * k); }
  geo.computeVertexNormals(); const pil = new THREE.Mesh(geo, basalt); pil.position.set(Math.cos(a) * r, 50, Math.sin(a) * r); cave.add(pil);
}
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), basalt); ceiling.rotation.x = Math.PI / 2; ceiling.position.y = 105; cave.add(ceiling);
scene.add(cave);

// ---------- Feu ----------
const flameTex = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 128; const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 92, 2, 32, 80, 60); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(32, 2); ctx.quadraticCurveTo(64, 80, 32, 126); ctx.quadraticCurveTo(0, 80, 32, 2); ctx.fill(); return new THREE.CanvasTexture(c);
})();
const flames = [];
function makeFire(color, scale = 1, light = true) {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, color: new THREE.Color(color).lerp(new THREE.Color(0xffffff), i === 3 ? 0.6 : 0), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    s.userData.base = scale * (i === 3 ? 0.55 : 1 - i * 0.12); s.position.set((Math.random() - 0.5) * 0.2 * scale, 0.5 * scale, 0); g.add(s); flames.push(s);
  }
  if (light) { const l = new THREE.PointLight(color, 18 * scale, 22 * scale, 1.6); l.position.y = 0.8 * scale; g.add(l); g.userData.light = l; flames.push(l); }
  return g;
}
function makeBrazier(color, scale = 1) {
  const g = new THREE.Group();
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08 * scale, 0.14 * scale, 1.3 * scale, 8), bronze); leg.position.y = 0.65 * scale; g.add(leg);
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.55 * scale, 20, 10, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), bronze); bowl.position.y = 1.55 * scale; g.add(bowl);
  const fire = makeFire(color, scale); fire.position.y = 1.5 * scale; g.add(fire);
  return shadow(g);
}

// ---------- Ruines grecques ----------
function column(h, r = 0.35) {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.9, r, h, 20, 1), marble); shaft.position.y = h / 2; g.add(shaft);
  for (const y of [0.12, h - 0.12]) { const cap = new THREE.Mesh(new THREE.BoxGeometry(r * 2.6, 0.24, r * 2.6), marble); cap.position.y = y; g.add(cap); }
  return shadow(g);
}
function cypress(h) {
  const g = new THREE.Group();
  for (let k = 0; k < 3; k++) { const c = new THREE.Mesh(new THREE.ConeGeometry(h * (0.13 - k * 0.025), h * (0.75 - k * 0.12), 9), cypressMat); c.position.y = h * (0.42 + k * 0.17); g.add(c); }
  return shadow(g);
}

// ---------- Îlots ----------
function makeIslet(radius, seed, { decor = true } = {}) {
  const g = new THREE.Group();
  const geo = new THREE.CylinderGeometry(radius, radius * 1.35, 9, 72, 8, false); const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const a = Math.atan2(p.getZ(i), p.getX(i)); const y = p.getY(i);
    const k = 1 + fbm(Math.cos(a) * 2 + seed, y * 0.25, Math.sin(a) * 2, 5) * 0.35 * (y < 4.4 ? 1 : 0.25);
    p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k);
  }
  geo.computeVertexNormals();
  const rock = new THREE.Mesh(geo, basalt); rock.position.y = -2.6; g.add(shadow(rock));
  const top = 1.9;
  const floor = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.78, radius * 0.8, 0.35, 64), marble); floor.position.y = top; g.add(shadow(floor));
  const step = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.84, radius * 0.86, 0.2, 64), marble); step.position.y = top - 0.22; g.add(shadow(step));
  g.userData.top = top + 0.17;
  if (decor) {
    const rnd = (n) => { const a = Math.random() * Math.PI * 2, d = radius * (0.55 + Math.random() * 0.2); return [Math.cos(a) * d, Math.sin(a) * d, a]; };
    for (let i = 0; i < 2; i++) { const [x, z] = rnd(); const c = column(2.5 + Math.random() * 2.5); c.position.set(x, g.userData.top, z); g.add(c); }
    { const [x, z, a] = rnd(); const fallen = column(3); fallen.rotation.set(0, a, Math.PI / 2); fallen.position.set(x, g.userData.top + 0.35, z); g.add(fallen); }
    for (let i = 0; i < 2; i++) { const [x, z] = rnd(); const c = cypress(4 + Math.random() * 3); c.position.set(x * 1.05, g.userData.top, z * 1.05); g.add(c); }
    // asphodèles (fleurs pâles des Enfers)
    const pts = []; for (let i = 0; i < 60; i++) { const a = Math.random() * 6.283, d = radius * (0.85 + Math.random() * 0.25); pts.push(Math.cos(a) * d, top - 0.1 + Math.random() * 0.4, Math.sin(a) * d); }
    const fg = new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    g.add(new THREE.Points(fg, new THREE.PointsMaterial({ color: 0xe9e2c8, size: 0.22, sizeAttenuation: true })));
  }
  return g;
}

// ---------- Âmes (agents) ----------
const ghostMat = (color) => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { color: { value: new THREE.Color(color) }, time: { value: 0 } },
  vertexShader: 'varying vec3 vN; varying vec3 vV; varying float vY; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); vY = position.y; gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'uniform vec3 color; uniform float time; varying vec3 vN; varying vec3 vV; varying float vY; void main(){ float f = pow(1.0 - abs(dot(vN, vV)), 1.6); float flick = 0.85 + 0.15*sin(time*3.0 + vY*6.0); gl_FragColor = vec4(color * (0.25 + f*1.6) * flick, 0.25 + f*0.7); }',
});
const ghosts = [];
function tabletTexture(agent) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 300; const ctx = c.getContext('2d');
  ctx.fillStyle = '#1b1712'; ctx.fillRect(0, 0, 512, 300);
  ctx.strokeStyle = '#6d5532'; ctx.lineWidth = 6; ctx.strokeRect(8, 8, 496, 284);
  ctx.fillStyle = STATUS[agent.status][1]; ctx.font = '700 26px Cinzel'; ctx.textAlign = 'center'; ctx.fillText(agent.title.toUpperCase().slice(0, 28), 256, 60);
  ctx.font = '19px "JetBrains Mono"'; ctx.textAlign = 'left'; ctx.fillStyle = '#d8c7a4';
  ['› ' + agent.activity, '› ' + agent.tools + ' outils', '› ' + agent.time].forEach((l, i) => ctx.fillText(l, 36, 130 + i * 40));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makeShade(agent) {
  const g = new THREE.Group(); const color = STATUS[agent.status][1];
  // table de pierre + tablette gravée
  const table = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.9, 1.1), marble); table.position.set(0, 0.45, -0.7); g.add(shadow(table));
  const tablet = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1, 0.12), new THREE.MeshStandardMaterial({ color: 0x222018, roughness: 0.8 })); tablet.position.set(0, 1.35, -1.05); tablet.rotation.x = -0.15; g.add(shadow(tablet));
  const txt = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.88), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xffffff, emissiveMap: tabletTexture(agent), emissiveIntensity: 1.1 }));
  txt.position.set(0, 1.35, -0.985); txt.rotation.x = -0.15; g.add(txt);
  const bench = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 0.6), marble); bench.position.set(0, 0.25, 0.55); g.add(shadow(bench));
  // l'ombre (âme) qui travaille
  const mat = ghostMat(color); const soul = new THREE.Group(); soul.position.set(0, 0.5, 0.45);
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.6, 8, 16), mat); torso.position.y = 0.6; soul.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 20, 16), mat); head.position.y = 1.25; soul.add(head);
  const robe = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.1, 20, 1, true), mat); robe.position.y = 0.15; soul.add(robe);
  const arms = [-0.32, 0.32].map((x) => { const pv = new THREE.Group(); pv.position.set(x, 0.85, 0); const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.5, 4, 8), mat); arm.position.set(0, -0.05, -0.28); arm.rotation.x = Math.PI / 2.3; pv.add(arm); soul.add(pv); return pv; });
  g.add(soul);
  const glow = new THREE.PointLight(color, 4, 6, 2); glow.position.set(0, 1.6, 0.4); g.add(glow);
  ghosts.push({ agent, soul, arms, mat });
  return g;
}

// ---------- Pont de pierre en arche ----------
function makeBridge(a, b) {
  const g = new THREE.Group(); const len = a.distanceTo(b); const rise = Math.min(3, len * 0.12);
  const at = (t) => a.clone().lerp(b, t).add(new THREE.Vector3(0, Math.sin(Math.PI * t) * rise, 0));
  const dir = new THREE.Vector3().subVectors(b, a).setY(0).normalize(); const side = dir.clone().cross(new THREE.Vector3(0, 1, 0));
  const n = Math.round(len / 0.9);
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n; const blk = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.45, 0.86), marble); blk.position.copy(at(t)); blk.lookAt(at(Math.min(1, t + 0.01))); g.add(blk);
    if (i % 3 === 1) for (const s of [1, -1]) { const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.9, 8), marble); post.position.copy(at(t)).add(side.clone().multiplyScalar(1.15 * s)).add(new THREE.Vector3(0, 0.6, 0)); g.add(post); }
  }
  for (const s of [1, -1]) { const pts = Array.from({ length: 30 }, (_, i) => at(i / 29).add(side.clone().multiplyScalar(1.15 * s)).add(new THREE.Vector3(0, 1.05, 0))); g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, 0.09, 6), marble)); }
  // arche sous le tablier, jusqu'à l'eau
  const archPts = Array.from({ length: 24 }, (_, i) => at(i / 23).add(new THREE.Vector3(0, -0.6 - (1 - Math.sin(Math.PI * i / 23)) * 1.6, 0)));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(archPts), 48, 0.35, 8), basalt));
  return shadow(g);
}

// ---------- Hub : tholos (temple rond) et flamme éternelle de Claude ----------
const hub = makeIslet(17, 0.7, { decor: false }); scene.add(hub);
const T = hub.userData.top;
for (let k = 0; k < 3; k++) { const st = new THREE.Mesh(new THREE.CylinderGeometry(8.4 - k * 0.6, 8.6 - k * 0.6, 0.35, 64), marble); st.position.y = T + 0.17 + k * 0.35; hub.add(shadow(st)); }
const TT = T + 1.05;
for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2; const c = column(6.5, 0.38); c.position.set(Math.cos(a) * 6.6, TT, Math.sin(a) * 6.6); hub.add(c); }
const entab = new THREE.Mesh(new THREE.CylinderGeometry(7.3, 7.3, 0.9, 64, 1, true), marble); entab.position.y = TT + 6.95; entab.material = marble; hub.add(shadow(entab));
const roof = new THREE.Mesh(new THREE.ConeGeometry(7.8, 3, 64), new THREE.MeshStandardMaterial({ color: 0x5a3a26, roughness: 0.7 })); roof.position.y = TT + 8.9; hub.add(shadow(roof));
const altar = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, 1.4, 24), marble); altar.position.y = TT + 0.7; hub.add(shadow(altar));
const eternal = makeFire(0xff7a3d, 3.2); eternal.position.y = TT + 1.3; hub.add(eternal);
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9, 4), new THREE.MeshStandardMaterial({ color: 0x220a00, emissive: 0xff8a3d, emissiveIntensity: 4 })); core.position.y = TT + 3.6; hub.add(core);
const hubLabel = document.createElement('div'); hubLabel.className = 'label hub'; hubLabel.innerHTML = '<div class="title">CLAUDE</div><div class="sub">la flamme éternelle t’écoute</div>';
const hubLabelObj = new CSS2DObject(hubLabel); hubLabelObj.position.set(0, TT + 12.5, 0); hub.add(hubLabelObj);
for (let i = 0; i < 4; i++) { const a = (i / 4) * Math.PI * 2 + Math.PI / 4; const br = makeBrazier(0xff8a3d, 1.1); br.position.set(Math.cos(a) * 10.5, T, Math.sin(a) * 10.5); hub.add(br); }

// Stèles des shells : dalles gravées, texte qui luit comme des braises.
function steleTexture(sh) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 768; const ctx = c.getContext('2d');
  ctx.fillStyle = '#26221d'; ctx.fillRect(0, 0, 512, 768);
  for (let i = 0; i < 2000; i++) { ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.04})`; ctx.fillRect(Math.random() * 512, Math.random() * 768, 2, 2); }
  ctx.strokeStyle = '#8a6a3c'; ctx.lineWidth = 8; ctx.strokeRect(18, 18, 476, 732);
  ctx.fillStyle = '#ffb35c'; ctx.font = '700 30px Cinzel'; ctx.textAlign = 'center'; ctx.fillText('ΚΕΛΥΦΟΣ', 256, 76);
  ctx.font = '600 22px "JetBrains Mono"'; ctx.fillStyle = '#ffd59a'; ctx.fillText(sh.cmd.slice(0, 32), 256, 128);
  ctx.textAlign = 'left'; ctx.font = '19px "JetBrains Mono"';
  const lines = sh.lines.flatMap((l) => l.match(/.{1,34}/g) || ['']);
  lines.forEach((l, i) => { ctx.fillStyle = i === lines.length - 1 ? '#ffe2b0' : '#e09a52'; ctx.fillText(l, 44, 200 + i * 34); });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
SHELLS.forEach((sh, i) => {
  const a = Math.PI / 2 + (i - 1) * 0.5; const x = Math.cos(a) * 12.5, z = Math.sin(a) * 12.5;
  const g = new THREE.Group(); g.position.set(x, T, z); g.lookAt(x * 3, T, z * 3);
  const slab = new THREE.Mesh(new THREE.BoxGeometry(2.7, 4, 0.45), new THREE.MeshStandardMaterial({ color: 0x2b2722, roughness: 0.9 })); slab.position.y = 2; g.add(slab);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.35, 0.45, 24, 1, false, 0, Math.PI), slab.material); top.rotation.set(Math.PI / 2, Math.PI / 2, 0); top.position.y = 4; g.add(top);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(2.45, 3.65), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xffffff, emissiveMap: steleTexture(sh), emissiveIntensity: 1.2 }));
  face.position.set(0, 2.05, 0.23); g.add(face); hub.add(shadow(g));
});

// ---------- Îlots des agents ----------
AGENTS.forEach((agent, i) => {
  const angle = Math.PI / 2 + (i - 1.5) * (Math.PI / 3.1);
  const dist = 38 + (i % 2) * 7;
  const pos = new THREE.Vector3(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
  const isl = makeIslet(7, 5 + i * 2.7); isl.position.copy(pos); scene.add(isl);
  const shade = makeShade(agent); shade.position.y = isl.userData.top; shade.rotation.y = -angle + Math.PI / 2; isl.add(shade);
  const br = makeBrazier(STATUS[agent.status][1], 0.9); const side = new THREE.Vector3(Math.cos(angle + 1.2), 0, Math.sin(angle + 1.2)).multiplyScalar(3.4); br.position.set(side.x, isl.userData.top, side.z); isl.add(br);
  const dir = pos.clone().normalize();
  const a = dir.clone().multiplyScalar(14.6); a.y = hub.userData.top + 0.1;
  const b = pos.clone().sub(dir.clone().multiplyScalar(6)); b.y = isl.userData.top + 0.1;
  scene.add(makeBridge(a, b));
  const [label, color] = STATUS[agent.status];
  const el = document.createElement('div'); el.className = 'label';
  el.innerHTML = `<div class="kind">ÂME · ${agent.type}<span class="pill" style="background:${color}">${label}</span></div><div class="title">${agent.title}</div><div class="sub">${agent.time} · ${agent.tools} outils</div>${agent.status === 'running' ? `<div class="act">${agent.activity}</div>` : ''}`;
  const obj = new CSS2DObject(el); obj.position.set(0, isl.userData.top + 4.2, 0); isl.add(obj);
});

// ---------- Charon et sa barque ----------
const boat = new THREE.Group();
const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x2a1c12, roughness: 0.85 }));
hull.scale.set(1.1, 0.7, 4); boat.add(hull);
const charon = new THREE.Group(); charon.position.set(0, 0, 1.6);
const cloak = new THREE.Mesh(new THREE.ConeGeometry(0.6, 2.6, 14), new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 1 })); cloak.position.y = 1.3; charon.add(cloak);
const hood = new THREE.Mesh(new THREE.SphereGeometry(0.36, 14, 10), cloak.material); hood.position.y = 2.6; charon.add(hood);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 6, 6), new THREE.MeshStandardMaterial({ color: 0x3a2a1a })); pole.position.set(0.5, 1.6, 0); pole.rotation.z = 0.35; charon.add(pole);
boat.add(charon);
const lantern = new THREE.Group(); lantern.position.set(0, 1.5, -3.6);
const lFire = makeFire(0x7dffb0, 0.5, false); lantern.add(lFire);
const lLight = new THREE.PointLight(0x7dffb0, 12, 18, 1.8); lantern.add(lLight); boat.add(lantern);
scene.add(shadow(boat));

// ---------- Brume, braises, âmes errantes ----------
const mistTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const ctx = c.getContext('2d'); const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,0.5)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const mist = new THREE.Group();
for (let i = 0; i < 90; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: mistTex, color: 0x6fa59a, transparent: true, opacity: 0.16, depthWrite: false })); const a = Math.random() * 6.283, r = 10 + Math.random() * 120; s.position.set(Math.cos(a) * r, 0.8 + Math.random() * 1.5, Math.sin(a) * r); s.scale.set(18 + Math.random() * 20, 5 + Math.random() * 4, 1); mist.add(s); }
scene.add(mist);
function particles(n, color, size, spread, yMin, yMax) {
  const pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, r = Math.random() * spread; pos.set([Math.cos(a) * r, yMin + Math.random() * (yMax - yMin), Math.sin(a) * r], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color, size, map: mistTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); scene.add(pts); return pts;
}
const embers = particles(400, 0xff8a3d, 0.35, 14, 2, 30);
const wisps = particles(160, 0x7fe9ff, 0.9, 120, 1, 25);

// ---------- Rendu ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.7, 0.55));
composer.addPass(new OutputPass());
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  water.material.uniforms.time.value += dt * 0.25;
  flames.forEach((f, i) => {
    if (f.isPointLight) { f.intensity = f.intensity * 0.8 + (f.userData.i0 ??= f.intensity) * (0.75 + Math.random() * 0.5) * 0.2; return; }
    const k = f.userData.base * (0.85 + Math.sin(t * 9 + i * 1.7) * 0.12 + Math.random() * 0.05); f.scale.set(k * 0.8, k * 1.6, 1);
  });
  core.rotation.y += dt * 0.5; core.position.y = TT + 3.6 + Math.sin(t * 1.4) * 0.25;
  ghosts.forEach(({ agent, soul, arms, mat }, i) => {
    mat.uniforms.time.value = t; const run = agent.status === 'running';
    soul.position.y = 0.5 + Math.sin(t * 1.3 + i) * (run ? 0.06 : 0.15);
    arms.forEach((a, j) => (a.rotation.x = run ? Math.sin(t * 7 + j * 2) * 0.15 : 0.5));
  });
  const ba = t * 0.05; boat.position.set(Math.cos(ba) * 58, 0.15 + Math.sin(t * 1.2) * 0.08, Math.sin(ba) * 58); boat.rotation.y = -ba; boat.rotation.z = Math.sin(t * 0.9) * 0.04;
  const ep = embers.geometry.attributes.position; for (let i = 0; i < ep.count; i++) { let y = ep.getY(i) + dt * (1 + (i % 5) * 0.3); if (y > 30) y = 2; ep.setY(i, y); } ep.needsUpdate = true;
  wisps.rotation.y += dt * 0.02; mist.rotation.y -= dt * 0.006;
  controls.update(); composer.render(); labelRenderer.render(scene, camera);
});
</script>
