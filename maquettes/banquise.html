// ---------- Outils ----------
const noise = new ImprovedNoise();
const fbm = (x, y, z, oct = 4) => { let a = 0.5, f = 1, s = 0; for (let i = 0; i < oct; i++) { s += a * noise.noise(x * f, y * f, z * f); a *= 0.5; f *= 2; } return s; };
const pnoise = (u, v, s, o = 4) => fbm(Math.cos(u * 6.283) * s, Math.sin(u * 6.283) * s, Math.cos(v * 6.283) * s + Math.sin(v * 6.283) * s * 0.5 + 3.7, o);
const rnd = (a, b) => a + Math.random() * (b - a);
const cv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
const tex = (c) => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
function canvasTexture(size, paint, repeat = 1) {

  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) { const [r, g, b] = paint(x / size, y / size); const i = (y * size + x) * 4; img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255; }
  ctx.putImageData(img, 0, 0); const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); return t;
}
const shadow = (o) => { o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };
// Liseré de Fresnel : la glace s'allume sur ses bords.

  };
  mat.customProgramCacheKey = () => 'rim-' + key; return mat;
}

const snowTex = canvasTexture(256, (u, v) => { const k = 236 + pnoise(u, v, 9, 3) * 30 + (Math.random() - 0.5) * 10; return [k * 0.96, k * 0.98, k]; }, 3);
const glowTex = (() => { const [c, ctx] = cv(128, 128); const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.35, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const mistTex = (() => { const [c, ctx] = cv(128, 128); const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,0.5)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();

// Matériaux
const bergIce = withRim(new THREE.MeshStandardMaterial({ vertexColors: true, map: iceTex, bumpMap: iceTex, bumpScale: 0.6, roughness: 0.28, flatShading: true, emissive: 0x06182a }), 0x7fd4ff, 2.2, 0.55, 'berg');

// ---------- Ciel : nuit polaire, aurore boréale, étoiles ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 64, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: { time: { value: 0 }, horizon: { value: fogCol } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform float time; uniform vec3 horizon; varying vec3 vDir;
    float h1(float n){ return fract(sin(n) * 43758.5453); }
    float n1(float x){ float i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return mix(h1(i), h1(i + 1.0), f); }
    void main(){
      vec3 d = normalize(vDir); float y = d.y;
      vec3 col = mix(horizon, vec3(0.0015, 0.003, 0.009), pow(smoothstep(-0.02, 0.6, y), 0.6));
      vec3 au = vec3(0.0);
      if (y > 0.012 && y < 0.42) {
        for (int i = 0; i < 12; i++) {
          float fi = float(i) / 12.0;
          vec2 p = d.xz / y * (1.0 + fi * 3.0) * 0.18;   // calque de rideau à l'altitude fi
          for (int r = 0; r < 3; r++) {
            float fr = float(r);
            float c = (r == 0 ? -2.4 : r == 1 ? 2.6 : -3.5) + sin(p.x * 0.42 + time * 0.07 + fr * 2.0) * 0.6 + sin(p.x * 1.25 - time * 0.11 + fr) * 0.2 + (n1(p.x * 0.8 + fr * 13.0 + time * 0.05) - 0.5) * 0.45;
            float dd = p.y - c, band = exp(-dd * dd * 7.0);
            float rays = pow(n1(p.x * 6.0 + fr * 31.0 + time * 0.35) * 0.7 + n1(p.x * 17.0 - time * 0.5) * 0.3, 1.6);
            vec3 tint = r == 1 ? mix(vec3(0.25, 0.85, 0.8), vec3(0.75, 0.25, 0.85), smoothstep(0.05, 0.7, fi))
                               : mix(vec3(0.12, 1.0, 0.5), vec3(0.5, 0.18, 0.95), smoothstep(0.15, 0.85, fi));
            au += tint * band * rays * (1.0 - fi) * (1.0 - fi * 0.3);
          }
        }
        au *= 0.2 * smoothstep(0.012, 0.06, y);
      }
      gl_FragColor = vec4(col + au, 1.0);
    }`,
}));
sky.renderOrder = -2; scene.add(sky);
{

// ---------- Mer arctique (reflète l'aurore) ----------
const waterNormals = (() => {
  const N = 256, [c, ctx] = cv(N, N); const img = ctx.createImageData(N, N);
  const waves = Array.from({ length: 14 }, (_, i) => ({ kx: Math.round(Math.cos(i * 2.4) * (2 + i)), ky: Math.round(Math.sin(i * 2.4) * (2 + i)), a: 1 / (2 + i), p: i * 1.7 }));
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let dx = 0, dy = 0; for (const w of waves) { const c2 = Math.cos(2 * Math.PI * (w.kx * x + w.ky * y) / N + w.p) * w.a; dx += c2 * w.kx; dy += c2 * w.ky; }
    const n = new THREE.Vector3(-dx * 0.06, -dy * 0.06, 1).normalize(); const i = (y * N + x) * 4;
    img.data[i] = (n.x * 0.5 + 0.5) * 255; img.data[i + 1] = (n.y * 0.5 + 0.5) * 255; img.data[i + 2] = (n.z * 0.5 + 0.5) * 255; img.data[i + 3] = 255;

})();

});

  for (let j = 0; j < m; j++) { const a = (j / m) * 6.283, r = 0.78 + Math.random() * 0.22 + noise.noise(Math.cos(a) * 1.5, Math.sin(a) * 1.5, k + 0.5) * 0.35; j ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r) : sh.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
  const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.3, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.08, bevelSegments: 1 }); geo.rotateX(-Math.PI / 2); return geo;
});
const agentPos = AGENTS.map((_, i) => { const a = Math.PI / 2 + (i - 1.5) * (Math.PI / 3.1), d = 38 + (i % 2) * 7; return new THREE.Vector3(Math.cos(a) * d, 0, Math.sin(a) * d); });
const segDist = (px, pz, b) => { const L = b.length(), ux = b.x / L, uz = b.z / L, t = Math.max(0, Math.min(L, px * ux + pz * uz)); return Math.hypot(px - ux * t, pz - uz * t); };
for (let n = 0, tries = 0; n < 150 && tries < 2000; tries++) {
  const near = Math.random() < 0.55, r = near ? rnd(21, 53) : rnd(85, 300), a = rnd(0, 6.283), s = near ? rnd(1, 3.2) : rnd(2, 7);
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (agentPos.some((p) => Math.hypot(x - p.x, z - p.z) < 9 + s || segDist(x, z, p) < 3 + s)) continue;
  const pl = new THREE.Mesh(plateGeos[n % 6], plateMat); pl.position.set(x, -0.14, z); pl.rotation.y = rnd(0, 6.283); pl.scale.set(s * rnd(0.8, 1.3), rnd(0.7, 1.2), s); pl.receiveShadow = true; scene.add(pl); n++;
}
// Icebergs lointains, silhouettes sous l'aurore.
for (let i = 0; i < 26; i++) {
  const a = (i / 26) * 6.283 + rnd(0, 0.2), r = rnd(190, 330), hgt = rnd(14, 55), rad = rnd(10, 26);
  const geo = new THREE.CylinderGeometry(rad * rnd(0.15, 0.5), rad, hgt, 9, 4); const p = geo.attributes.position;
  for (let j = 0; j < p.count; j++) { const k = 1 + fbm(p.getX(j) * 0.08 + i, p.getY(j) * 0.08, p.getZ(j) * 0.08, 3) * 0.7; p.setX(j, p.getX(j) * k); p.setZ(j, p.getZ(j) * k); if (p.getY(j) > 0) p.setY(j, p.getY(j) + noise.noise(p.getX(j) * 0.2, i, p.getZ(j) * 0.2) * hgt * 0.25); }
  const m = new THREE.Mesh(geo, farIce); m.position.set(Math.cos(a) * r, hgt / 2 - 3, Math.sin(a) * r); m.rotation.y = rnd(0, 6.283); scene.add(m);
}

const flameTex = (() => {

  const g = ctx.createRadialGradient(32, 92, 2, 32, 80, 60); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,0.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(32, 2); ctx.quadraticCurveTo(64, 80, 32, 126); ctx.quadraticCurveTo(0, 80, 32, 2); ctx.fill(); return new THREE.CanvasTexture(c);
})();
const flames = [];
function makeFire(color, scale = 1, light = true) {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, color: new THREE.Color(color).lerp(new THREE.Color(0xffffff), i === 3 ? 0.6 : 0), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    s.userData.base = scale * (i === 3 ? 0.55 : 1 - i * 0.12); s.position.set((Math.random() - 0.5) * 0.2 * scale, 0.5 * scale, 0); g.add(s); flames.push(s);
  }
  if (light) { const l = new THREE.PointLight(color, 18 * scale, 22 * scale, 1.6); l.position.y = 0.8 * scale; g.add(l); flames.push(l); }
  return g;
}
// Lanterne-tempête suspendue à une potence de bois.
const lanterns = [];
function makeLantern(color, { post = true, light = true, s = 1 } = {}) {
  const g = new THREE.Group(); const L = new THREE.Group();
  if (post) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 2.2, 6), wood); pole.position.y = 1.1; g.add(pole);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.05), wood); arm.position.set(0.28, 2.12, 0); g.add(arm);
    const hook = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.22, 4), metal); hook.position.set(0.55, 1.99, 0); g.add(hook);
    L.position.set(0.55, 1.3, 0);
  }
  const glassMat = new THREE.MeshStandardMaterial({ color: 0, emissive: color, emissiveIntensity: 2.6 });

  lines.forEach((l, i) => { ctx.fillStyle = i === lines.length - 1 ? '#e8fdff' : '#6fd3ef'; ctx.fillText(l, 44, 206 + i * 36); });
  if (lines.length) { ctx.fillStyle = '#e8fdff'; ctx.fillRect(44, 214 + lines.length * 36 - 22, 12, 22); }
  return tex(c);
}
SHELLS.forEach((sh, i) => {
  const a = Math.PI / 2 + (i - 1) * 0.5; const x = Math.cos(a) * 12.5, z = Math.sin(a) * 12.5;
  const g = new THREE.Group(); g.position.set(x, T, z); g.lookAt(x * 3, T, z * 3);
  const slab = new THREE.Mesh(new THREE.BoxGeometry(2.8, 4.3, 0.7), clearIce); slab.position.y = 2.15; g.add(slab);
  const tip = new THREE.Mesh(new THREE.BoxGeometry(1.98, 1.98, 0.7), clearIce); tip.rotation.z = Math.PI / 4; tip.scale.y = 0.45; tip.position.y = 4.3; g.add(tip);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(2.55, 4.0), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xffffff, emissiveMap: runeTexture(sh), emissiveIntensity: 1.15, transparent: true, opacity: 0.95 }));
  face.position.set(0, 2.15, 0.36); g.add(face);
  // petit inukshuk de pierre à côté
  const ik = new THREE.Group(); ik.position.set(1.95, 0, 0.3);
  for (const [w, h, y, xo] of [[0.22, 0.6, 0.3, -0.18], [0.22, 0.6, 0.3, 0.18], [0.8, 0.18, 0.69, 0], [0.3, 0.42, 0.99, 0], [0.9, 0.14, 1.27, 0], [0.24, 0.24, 1.46, 0]]) { const s = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.26), stone); s.position.set(xo, y, 0); s.rotation.y = rnd(-0.1, 0.1); ik.add(s); }
  g.add(ik); hub.add(shadow(g));
});

// ---------- Îlots des agents ----------
AGENTS.forEach((agent, i) => {
  const angle = Math.PI / 2 + (i - 1.5) * (Math.PI / 3.1), pos = agentPos[i];
  const isl = makeBerg(6.5, 5 + i * 2.7, { h: 6, top: 1.8 }); isl.position.copy(pos); scene.add(isl);
  const top = isl.userData.top;
  const ex = makeExplorer(agent, i); ex.position.y = top; ex.rotation.y = -angle + Math.PI / 2; isl.add(ex);
  const color = STATUS[agent.status][1];
  const lan = makeLantern(color); const side = new THREE.Vector3(Math.cos(angle + 1.2), 0, Math.sin(angle + 1.2)).multiplyScalar(2.6); lan.position.set(side.x, top, side.z); lan.rotation.y = -angle; isl.add(shadow(lan));
  // décor de camp : tente, congères, éclats de glace (hors de l'arrivée de la passerelle)
  const toHub = angle + Math.PI, spot = (r) => { let a; do a = rnd(0, 6.283); while (Math.abs(Math.atan2(Math.sin(a - toHub), Math.cos(a - toHub))) < 0.7 || Math.abs(Math.atan2(Math.sin(a - angle - 1.2), Math.cos(a - angle - 1.2))) < 0.5); return [Math.cos(a) * r, Math.sin(a) * r]; };
  { const [x, z] = spot(4); const tent = new THREE.Mesh(new THREE.ConeGeometry(1.2, 1.7, 4, 1), canvasMat); tent.position.set(x, top + 0.85, z); tent.rotation.y = rnd(0, 3); isl.add(shadow(tent)); }
  for (let k = 0; k < 3; k++) { const [x, z] = spot(rnd(3.5, 5.2)); const sh = shard(rnd(0.7, 1.3)); sh.position.set(x, top + 0.6, z); isl.add(sh); }
  for (let k = 0; k < 4; k++) { const [x, z] = spot(rnd(2.8, 5.5)); const m = mound(rnd(0.5, 1)); m.position.set(x, top - 0.05, z); isl.add(m); }
  const dir = pos.clone().normalize();
  const a = dir.clone().multiplyScalar(15); a.y = T + 0.1;
  const b = pos.clone().sub(dir.clone().multiplyScalar(5.4)); b.y = top + 0.1;
  scene.add(makeBridge(a, b, agent.status === 'running'));
  const [label] = STATUS[agent.status];
  const el = document.createElement('div'); el.className = 'label';
  el.innerHTML = `<div class="kind">EXPLORATEUR · ${agent.type}<span class="pill" style="background:${color}">${label}</span></div><div class="title">${agent.title}</div><div class="sub">${agent.time} · ${agent.tools} outils</div>${agent.status === 'running' ? `<div class="act">${agent.activity}</div>` : ''}`;
  const obj = new CSS2DObject(el); obj.position.set(0, top + 4.6, 0); isl.add(obj);
});

// ---------- Anciens agents : kayaks et glaçons à lanterne qui dérivent ----------
function pennantTexture(name) {
  const [c, ctx] = cv(256, 64); ctx.fillStyle = '#e9dfc6'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(256, 10); ctx.lineTo(240, 32); ctx.lineTo(256, 54); ctx.lineTo(0, 64); ctx.fill();
  ctx.fillStyle = '#26323e'; ctx.font = '600 19px Inter'; ctx.textBaseline = 'middle'; ctx.fillText(name.slice(0, 22), 10, 33); return tex(c);
}
const poolMat = new THREE.MeshBasicMaterial({ map: glowTex, color: 0xffb066, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false });
const drift = ANCIENS.map((name, i) => {
  const g = new THREE.Group();
  if (i % 2 === 0) {
    const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 10), new THREE.MeshStandardMaterial({ color: [0x8a3a22, 0x2c5a6e, 0x6e5a2a][(i / 2) % 3], roughness: 0.6 })); hull.scale.set(0.42, 0.22, 2.4); hull.position.y = 0.08; g.add(hull);
    const cockpit = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.05, 6, 16), dark); cockpit.rotation.x = Math.PI / 2; cockpit.position.y = 0.28; g.add(cockpit);
    const paddle = new THREE.Group(); paddle.position.set(0, 0.32, -0.5); paddle.rotation.y = 0.3;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 2.4, 5), wood); shaft.rotation.z = Math.PI / 2; paddle.add(shaft);
    for (const s of [-1, 1]) { const blade = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.02, 0.16), wood); blade.position.x = s * 1.25; paddle.add(blade); } g.add(paddle);
  } else {
    const blk = new THREE.Mesh(new THREE.DodecahedronGeometry(1.1, 0), facetIce); blk.scale.set(1.2, 0.5, 1); blk.position.y = 0.1; g.add(blk);
    const cap = mound(0.7); cap.position.y = 0.5; g.add(cap);
  }
  const lan = makeLantern(0xffc27a, { post: false, light: false, s: 1.3 }); lan.position.set(0, i % 2 ? 0.62 : 0.2, i % 2 ? 0 : 1.6); g.add(lan);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.5, 4), wood); pole.position.set(0.15, 0.85, i % 2 ? -0.5 : -1.5); g.add(pole);
  const pen = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.35), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xffffff, emissiveMap: pennantTexture(name), emissiveIntensity: 0.7, side: THREE.DoubleSide, transparent: true, alphaTest: 0.1 }));
  pen.position.set(0.86, 1.4, pole.position.z); g.add(pen);
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), poolMat); pool.rotation.x = -Math.PI / 2; pool.position.y = 0.04; pool.renderOrder = 1; g.add(pool);
  scene.add(shadow(g));
  return { g, pen, r: [57, 61, 66, 77, 80, 59][i], sp: rnd(0.012, 0.02), ph: i * 1.05 + rnd(0, 0.4) };
});

// ---------- Sessions : ballons-sondes lumineux au-dessus du hub ----------
function balloonTexture(s) {
  const [c, ctx] = cv(512, 256); const g = ctx.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#e6dccb'); ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 256);
  for (let x = 0; x < 512; x += 32) { ctx.fillStyle = 'rgba(120,140,160,0.12)'; ctx.fillRect(x, 0, 2, 256); }
  ctx.textAlign = 'center';
  for (const x of [128, 384]) { ctx.fillStyle = '#1d3044'; ctx.font = '700 40px "Josefin Sans"'; ctx.fillText(s.name, x, 140); ctx.font = '600 16px Inter'; ctx.fillStyle = '#5a6f82'; ctx.fillText('SONDE', x, 92); }
  return tex(c);
}
const sondes = SESSIONS.map((s, i) => {
  const g = new THREE.Group();
  const ball = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 20), new THREE.MeshStandardMaterial({ color: 0x223040, emissive: 0xffffff, emissiveMap: balloonTexture(s), emissiveIntensity: 0.8, roughness: 0.5 })); ball.scale.y = 1.18; g.add(ball);
  const neckM = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 12), ball.material); neckM.rotation.x = Math.PI; neckM.position.y = -1.42; g.add(neckM);
  const sg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -1.6, 0), new THREE.Vector3(0, -3.3, 0)]); g.add(new THREE.Line(sg, new THREE.LineBasicMaterial({ color: 0xcfdbe6 })));
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.4), metal); box.position.y = -3.45; g.add(box);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xffd28a, emissiveIntensity: 3 })); lamp.position.y = -3.72; g.add(lamp);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffc27a, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false })); halo.position.y = -3.72; halo.scale.setScalar(1.4); g.add(halo);
  const el = document.createElement('div'); el.className = 'label mini'; el.innerHTML = `<div class="kind">SESSION</div><div class="title">${s.name}</div><div class="sub">${s.where}</div>`;
  const obj = new CSS2DObject(el); obj.position.y = 2.2; g.add(obj);
  g.traverse((o) => o.layers.set(1)); scene.add(g); // trop hauts pour un reflet lisible
  return { g, ph: (i / SESSIONS.length) * 6.283 };
});

// ---------- Neige, vent, brume froide ----------
function particles(n, color, size, spread, yMin, yMax, opacity = 1, additive = false) {
  const pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * spread; pos.set([Math.cos(a) * r, yMin + Math.random() * (yMax - yMin), Math.sin(a) * r], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color, size, map: mistTex, transparent: true, opacity, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending })); scene.add(pts); return pts;
}
const SNOW_R = 110, flakes = particles(3200, 0xeef6ff, 0.3, SNOW_R, 0, 60, 0.95);
const sparks = particles(160, 0xffa25a, 0.3, 4, LB + 1, LB + 9, 1, true);
// la neige et le vent restent hors du reflet de l'eau (calque 1, invisible pour la caméra miroir)
flakes.layers.set(1); camera.layers.enable(1);
const WIND = new THREE.Vector3(1, 0, 0.35).normalize();
const gusts = (() => {
  const n = 260, pos = new Float32Array(n * 6);
  for (let i = 0; i < n; i++) { const x = rnd(-120, 120), y = rnd(0.5, 14), z = rnd(-120, 120), l = rnd(1.5, 4); pos.set([x, y, z, x + WIND.x * l, y, z + WIND.z * l], i * 6); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const ls = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xcfe6ff, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false })); ls.layers.set(1); scene.add(ls); return ls;
})();
const mist = new THREE.Group();
for (let i = 0; i < 80; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: mistTex, color: 0x8fb3cc, transparent: true, opacity: 0.12, depthWrite: false })); const a = Math.random() * 6.283, r = 12 + Math.random() * 120; s.position.set(Math.cos(a) * r, 0.8 + Math.random() * 1.8, Math.sin(a) * r); s.scale.set(18 + Math.random() * 20, 4 + Math.random() * 4, 1); mist.add(s); }
scene.add(mist);

// ---------- Rendu ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.65, 0.5, 0.74));
composer.addPass(new OutputPass());
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  water.material.uniforms.time.value += dt * 0.22;
  sky.material.uniforms.time.value = t; iglooMat.uniforms.time.value = t;
  auroraLight.intensity = 0.4 + Math.sin(t * 0.3) * 0.12;
  flames.forEach((f, i) => {
    if (f.isPointLight) { f.intensity = f.intensity * 0.8 + (f.userData.i0 ??= f.intensity) * (0.75 + Math.random() * 0.5) * 0.2; return; }
    const k = f.userData.base * (0.85 + Math.sin(t * 9 + i * 1.7) * 0.12 + Math.random() * 0.05); f.scale.set(k * 0.8, k * 1.6, 1);
  });
  lanterns.forEach((l) => { l.glassMat.emissiveIntensity = 2.3 + Math.sin(t * 11 + l.ph) * 0.25 + Math.random() * 0.2; l.L.rotation.z = Math.sin(t * 1.6 + l.ph) * 0.06; });
  core.rotation.y += dt * 0.6; core.position.y = LB + 2.2 + Math.sin(t * 1.4) * 0.15;
  beams.rotation.y = t * 0.35;
  hub.userData.blink.material.opacity = Math.sin(t * 3) > 0.6 ? 1 : 0.15;
  explorers.forEach(({ agent, body, neck, arms, breath }, i) => {
    const run = agent.status === 'running', fail = agent.status === 'failed';
    body.position.y = Math.abs(Math.sin(t * 1.2 + i)) * 0.03;
    arms[0].rotation.x = run ? Math.sin(t * 6 + i) * 0.18 : fail ? 0.9 : 0.4;
    arms[1].rotation.x = run ? Math.sin(t * 6 + i + 2) * 0.18 : fail ? 0.9 : 0.4; arms[1].rotation.y = run ? Math.sin(t * 2.3 + i) * 0.15 : 0;
    neck.rotation.x = fail ? 0.45 : run ? 0.15 + Math.sin(t * 0.8 + i) * 0.05 : -0.1;
    const ph = ((t * 0.45 + i * 0.37) % 1); breath.material.opacity = ph < 0.6 ? Math.sin((ph / 0.6) * Math.PI) * 0.5 : 0;
    breath.position.set(0, 1.68 + ph * 0.3, -0.25 - ph * 0.7); breath.scale.setScalar(0.25 + ph * 0.8);
  });
  sleds.forEach((s) => { const u = s.run ? 0.08 + 0.84 * (0.5 - 0.5 * Math.cos(t * 0.22 + s.ph)) : 0.9; const p = s.at(u); s.sled.position.copy(p).add(new THREE.Vector3(0, 0.2, 0)); s.sled.lookAt(s.at(Math.min(1, u + 0.01)).add(new THREE.Vector3(0, 0.2, 0))); });
  drift.forEach((d, i) => { const a = d.ph + t * d.sp; d.g.position.set(Math.cos(a) * d.r, Math.sin(t * 1.1 + i) * 0.05, Math.sin(a) * d.r); d.g.rotation.y = -a; d.g.rotation.z = Math.sin(t * 0.9 + i) * 0.04; d.pen.rotation.y = Math.sin(t * 3 + i) * 0.25; });
  sondes.forEach((s, i) => { const a = s.ph + t * 0.06; s.g.position.set(Math.cos(a) * 20, T + 21 + i * 3.6 + Math.sin(t * 0.8 + i * 2) * 0.4, Math.sin(a) * 20); s.g.rotation.y = t * 0.1 + i; s.g.rotation.z = Math.sin(t * 0.6 + i) * 0.05; });
  const fp = flakes.geometry.attributes.position;
  for (let i = 0; i < fp.count; i++) {
    let x = fp.getX(i) + dt * (WIND.x * 3 + Math.sin(t + i) * 0.6), y = fp.getY(i) - dt * (1.4 + (i % 7) * 0.25), z = fp.getZ(i) + dt * (WIND.z * 3 + Math.cos(t * 0.7 + i) * 0.5);
    if (y < 0) { y = 60; const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * SNOW_R; x = Math.cos(a) * r; z = Math.sin(a) * r; }
    if (x * x + z * z > SNOW_R * SNOW_R) { x = -x * 0.98; z = -z * 0.98; }
    fp.setXYZ(i, x, y, z);
  }
  fp.needsUpdate = true;
  const sp = sparks.geometry.attributes.position; for (let i = 0; i < sp.count; i++) { let y = sp.getY(i) + dt * (1 + (i % 5) * 0.3); if (y > LB + 9) y = LB + 1; sp.setY(i, y); } sp.needsUpdate = true;
  const gp = gusts.geometry.attributes.position;
  for (let i = 0; i < gp.count; i += 2) { const v = 22 + (i % 9) * 2; let x = gp.getX(i) + WIND.x * v * dt, z = gp.getZ(i) + WIND.z * v * dt; const dx = gp.getX(i + 1) - gp.getX(i), dz = gp.getZ(i + 1) - gp.getZ(i); if (x > 120) x -= 240; if (z > 120) z -= 240; gp.setX(i, x); gp.setZ(i, z); gp.setX(i + 1, x + dx); gp.setZ(i + 1, z + dz); }
  gp.needsUpdate = true;
  mist.rotation.y -= dt * 0.008;
  controls.update(); composer.render(); labelRenderer.render(scene, camera);
});
</script>
