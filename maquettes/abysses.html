// ---------- Moteur ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });

// ---------- Outils ----------
const noise = new ImprovedNoise();
const fbm = (x, y, z, oct = 4) => { let a = 0.5, f = 1, s = 0; for (let i = 0; i < oct; i++) { s += a * noise.noise(x * f, y * f, z * f); a *= 0.5; f *= 2; } return s; };
const pnoise = (u, v, s, o = 4) => fbm(Math.cos(u * 6.283) * s, Math.sin(u * 6.283) * s, Math.cos(v * 6.283) * s + Math.sin(v * 6.283) * s * 0.5 + 3.7, o);
const rand = (a, b) => a + Math.random() * (b - a);
function canvasTexture(size, paint, repeat = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size; const ctx = c.getContext('2d'); const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) { const [r, g, b] = paint(x / size, y / size); const i = (y * size + x) * 4; img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 255; }
  ctx.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = 8; return t;
}

  const c = document.createElement('canvas'); c.width = c.height = size; const ctx = c.getContext('2d'); const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => g.addColorStop(o, col)); ctx.fillStyle = g; ctx.fillRect(0, 0, size, size); return new THREE.CanvasTexture(c);
}
const glowTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.3, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
const bubbleTex = (() => {
  const t = radialTex([[0, 'rgba(255,255,255,0.05)'], [0.7, 'rgba(255,255,255,0.15)'], [0.86, 'rgba(255,255,255,0.9)'], [1, 'rgba(255,255,255,0)']], 64);
  const ctx = t.image.getContext('2d'); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(22, 22, 5, 0, 7); ctx.fill(); return t;
})();
const shadow = (o) => { o.traverse((m) => { if (m.isMesh && !m.material.isShaderMaterial) { m.castShadow = true; m.receiveShadow = true; } }); return o; };

// Caustiques : motif d'eau animé, projeté en émissif sur toutes les faces tournées vers la surface.
const CAUSTIC = `uniform float uTime; uniform float uCaus; varying vec3 vCW; varying float vCN;
float caustic(vec2 uv){ vec2 p = mod(uv * 6.28318, 6.28318) - 250.0; vec2 i = p; float c = 1.0; float t = uTime * 0.45 + 23.0;
  for (int n = 0; n < 4; n++) { float tt = t * (1.0 - 3.5 / float(n + 1)); i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / 0.005), p.y / (cos(i.y + tt) / 0.005))); }
  c /= 4.0; c = 1.17 - pow(c, 1.4); return pow(abs(c), 8.0); }`;
function oceanMat(params, { caustics = 1, sway = 0 } = {}) {

    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime; uniform float uSway; varying vec3 vCW; varying float vCN;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        float sw = max(position.y, 0.0); vec4 o4 = modelMatrix * vec4(0.0, 0.0, 0.0, 1.0);
        transformed.x += sin(uTime * 1.1 + position.y * 0.45 + o4.x * 0.3) * uSway * sw * sw; transformed.z += cos(uTime * 0.9 + position.y * 0.4 + o4.z * 0.3) * uSway * 0.7 * sw * sw;`)
      .replace('#include <project_vertex>', '#include <project_vertex>\nvCW = (modelMatrix * vec4(transformed, 1.0)).xyz; vCN = normalize(mat3(modelMatrix) * objectNormal).y;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\n' + CAUSTIC)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += vec3(0.45, 0.95, 1.0) * caustic(vCW.xz * 0.035) * uCaus * smoothstep(0.05, 0.7, vCN) * diffuseColor.rgb * 1.6 * exp(-length(vCW - cameraPosition) * 0.007);`);
  };

// Matière vivante : fresnel additif, ondulation optionnelle (méduses, anémones, verre).
function glowMat(color, { rim = color, stripes = 0, alpha = 0.3, sway = 0, dirY = -1 } = {}) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    uniforms: { color: { value: new THREE.Color(color) }, rim: { value: new THREE.Color(rim) }, time: U.time, stripes: { value: stripes }, alpha: { value: alpha }, sway: { value: sway }, dirY: { value: dirY } },
    vertexShader: `uniform float time; uniform float sway; uniform float dirY; varying vec3 vN; varying vec3 vV; varying vec2 vUv;
      void main(){ vec3 p = position; float d = max(p.y * dirY, 0.0); float ph = modelMatrix[3].x + modelMatrix[3].z;
        p.x += sin(time * 1.3 + d * 0.8 + ph) * sway * d * 0.3; p.z += cos(time * 1.1 + d * 0.7 + ph) * sway * d * 0.3;
        vec4 mv = modelViewMatrix * vec4(p, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); vUv = uv; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 color; uniform vec3 rim; uniform float time; uniform float stripes; uniform float alpha; varying vec3 vN; varying vec3 vV; varying vec2 vUv;
      void main(){ float f = pow(1.0 - abs(dot(vN, vV)), 1.8);
        float s = stripes > 0.0 ? 0.5 + 0.5 * pow(abs(sin(vUv.x * 3.14159 * stripes)), 6.0) : 1.0;

  });
}
// Rayons de lumière (puits descendant de la surface) et faisceaux de phares.
function rayMat(color, k = 0.12, beam = 0) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    uniforms: { color: { value: new THREE.Color(color) }, time: U.time, k: { value: k }, beam: { value: beam }, seed: { value: Math.random() * 10 } },
    vertexShader: 'varying vec3 vN; varying vec3 vV; varying vec2 vUv; varying float vD; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); vUv = uv; vD = length(mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: `uniform vec3 color; uniform float time; uniform float k; uniform float beam; uniform float seed; varying vec3 vN; varying vec3 vV; varying vec2 vUv; varying float vD;
      void main(){ float edge = pow(abs(dot(vN, vV)), 1.5);
        float st = beam > 0.5 ? 1.0 : 0.55 + 0.45 * sin(vUv.x * 31.4 + time * 0.3 + seed) * sin(vUv.x * 18.8 - time * 0.21 + seed);
        float fade = beam > 0.5 ? pow(vUv.y, 2.0) : smoothstep(0.0, 0.55, vUv.y) * smoothstep(1.0, 0.8, vUv.y);
        float a = edge * st * fade * (0.7 + 0.3 * sin(time * 0.4 + seed)) * k * exp(-vD * 0.006); gl_FragColor = vec4(color, a); }`,
  });
}

// ---------- Matières ----------
const sandTex = canvasTexture(256, (u, v) => { const r = Math.sin((v * 18 + pnoise(u, v, 2, 3) * 2.5) * Math.PI * 2) * 0.5 + 0.5; const k = 120 + r * 22 + pnoise(u, v, 24, 2) * 40; return [k * 0.9, k * 0.95, k * 0.86]; }, 40);
const stoneTex = canvasTexture(256, (u, v) => { const n = pnoise(u, v, 4) * 0.6 + pnoise(u, v, 16, 2) * 0.4; const alg = Math.max(0, pnoise(u, v, 2.2, 3)) * 1.6; const k = 100 + n * 60; return [k * (0.85 - alg * 0.3), k * (0.95 + alg * 0.25), k * (0.92 - alg * 0.1)]; }, 2);
const sand = oceanMat({ map: sandTex, roughness: 1 });
const stone = oceanMat({ map: stoneTex, roughness: 0.9 });
const reefRock = oceanMat({ map: stoneTex, color: 0x8a7c86, roughness: 0.95 });
const brass = oceanMat({ color: 0xb08a3e, metalness: 0.8, roughness: 0.35 }, { caustics: 0.6 });

const corals = [0xff7a6b, 0xe0559a, 0xffa94d, 0x9a6bff, 0x3fd1c0].map((c) => oceanMat({ color: c, roughness: 0.8, emissive: c, emissiveIntensity: 0.08 }));
const kelpMat = oceanMat({ color: 0x3d6b33, roughness: 0.9, side: THREE.DoubleSide }, { caustics: 0.4, sway: 0.004 });

// ---------- Ciel liquide et fond marin ----------
scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: { time: U.time, fogC: { value: scene.fog.color } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform float time; uniform vec3 fogC; varying vec3 vD; void main(){ float h = vD.y; vec3 top = vec3(0.22, 0.62, 0.68);
    vec3 c = mix(fogC * 0.25, fogC, smoothstep(-0.5, 0.0, h)); c = mix(c, top, pow(smoothstep(0.0, 1.0, h), 2.2));
    float sh = sin(vD.x * 40.0 + time * 0.7) * sin(vD.z * 37.0 - time * 0.6); c += top * 0.35 * smoothstep(0.55, 1.0, h) * max(sh, 0.0); gl_FragColor = vec4(c, 1.0); }`,
})));
const ground = (x, z) => { const d = Math.hypot(x, z); return fbm(x * 0.012, 0.3, z * 0.012, 4) * 18 * THREE.MathUtils.smoothstep(d, 70, 220) + fbm(x * 0.08, 1.7, z * 0.08, 2) * 0.8 - 0.2; };
{
  const geo = new THREE.PlaneGeometry(1200, 1200, 220, 220); geo.rotateX(-Math.PI / 2); const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, ground(p.getX(i), p.getZ(i)));
  geo.computeVertexNormals(); const floor = new THREE.Mesh(geo, sand); floor.receiveShadow = true; scene.add(floor);
}
// Puits de lumière venus de la surface.
for (let i = 0; i < 12; i++) {
  const a = Math.random() * 6.283, r = rand(0, 95), top = rand(5, 12);
  const ray = new THREE.Mesh(new THREE.CylinderGeometry(top, top * rand(1.8, 2.6), 130, 32, 1, true), rayMat(0x9fe9ff, rand(0.08, 0.16)));
  ray.position.set(Math.cos(a) * r, 60, Math.sin(a) * r); ray.rotation.set(rand(-0.15, 0.15), 0, rand(-0.15, 0.15)); scene.add(ray);
}

// ---------- Flore et ruines ----------
function branchCoral(mat, len, r, depth) {

  if (depth > 0) for (let k = 0; k < 2 + (Math.random() < 0.4); k++) { const c = branchCoral(mat, len * 0.75, r * 0.7, depth - 1); c.position.y = len * rand(0.75, 1); c.rotation.set(rand(-0.6, 0.6), rand(0, 6.28), rand(-0.6, 0.6)); g.add(c); }
  else { const tip = new THREE.Mesh(new THREE.SphereGeometry(r * 1.1, 8, 6), mat); tip.position.y = len; g.add(tip); }
  return g;
}
function brainCoral(mat, r) {
  const geo = new THREE.IcosahedronGeometry(r, 4); const p = geo.attributes.position; const s = Math.random() * 9;
  for (let i = 0; i < p.count; i++) { const v = new THREE.Vector3().fromBufferAttribute(p, i); const k = 1 + Math.sin(fbm(v.x * 0.6 + s, v.y * 0.6, v.z * 0.6, 3) * 40) * 0.05; v.multiplyScalar(k); v.y = Math.max(v.y, -r * 0.2) * 0.75; p.setXYZ(i, v.x, v.y, v.z); }
  geo.computeVertexNormals(); return new THREE.Mesh(geo, mat);
}
const fanTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const ctx = c.getContext('2d'); ctx.strokeStyle = '#fff';
  const grow = (x, y, a, l, w) => { if (l < 6) return; const x2 = x + Math.cos(a) * l, y2 = y + Math.sin(a) * l; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke(); grow(x2, y2, a - rand(0.2, 0.5), l * 0.78, w * 0.8); grow(x2, y2, a + rand(0.2, 0.5), l * 0.78, w * 0.8); };

})();
const fanMat = oceanMat({ color: 0xb54aa0, alphaMap: fanTex, alphaTest: 0.4, side: THREE.DoubleSide, roughness: 0.9 }, { caustics: 0.5 });
const fanCoral = (h) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(h, h), fanMat); m.geometry.translate(0, h / 2, 0); return m; };
function kelp(h) { const geo = new THREE.PlaneGeometry(0.7, h, 1, 24); geo.translate(0, h / 2, 0); return new THREE.Mesh(geo, kelpMat); }

// Couronne de ruines, arches et blocs effondrés.

for (let i = 0; i < 46; i++) { const a = Math.random() * 6.283, r = rand(60, 150); const c = brokenColumn(rand(2, 11), rand(0.6, 1.1)); c.rotation.set(rand(-0.12, 0.12), 0, rand(-0.12, 0.12)); place(c, Math.cos(a) * r, Math.sin(a) * r, -0.3); }

const sessions = SESSIONS.map((name, i) => {
  const j = makeJelly(1.5, [0x58f0c8, 0x6fb8ff, 0xff8ad8][i], 0xd8fff6, 12, 2.6); scene.add(j);
  const el = document.createElement('div'); el.className = 'label mini'; el.innerHTML = `<div class="kind">SESSION</div><div class="title">${name}</div>`;
  const o = new CSS2DObject(el); o.position.y = 3.2; j.add(o);
  return { j, a: (i / SESSIONS.length) * 6.283 + 0.6, r: 30 + i * 4, y: T + 18 + i * 3 };
});

// ---------- Anciens agents : sous-marins et cloche de plongée à la dérive ----------
function makeSub(hue) {
  const g = new THREE.Group(); const hull = oceanMat({ color: hue, metalness: 0.5, roughness: 0.55 }, { caustics: 0.6 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.9, 2.6, 8, 20), hull); body.rotation.x = Math.PI / 2; g.add(body);
  const tower = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 1.1), hull); tower.position.set(0, 0.95, 0.2); g.add(tower);
  for (const [w, h] of [[2.4, 0.08], [0.08, 1.3]]) { const fin = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.5), hull); fin.position.z = -1.9; g.add(fin); }
  const prop = new THREE.Group(); prop.position.z = -2.35; for (let k = 0; k < 3; k++) { const bl = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.75, 0.04), brass); bl.position.y = 0.32; const pv = new THREE.Group(); pv.rotation.z = (k / 3) * 6.283; pv.add(bl); prop.add(pv); } g.add(prop);
  const port = new THREE.MeshStandardMaterial({ color: 0, emissive: 0xffd98a, emissiveIntensity: 1.4 });
  for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { const c = new THREE.Mesh(new THREE.CircleGeometry(0.16, 16), port); c.position.set(s * 0.91, 0.1, -0.6 + k * 0.7); c.rotation.y = s * Math.PI / 2; g.add(c); }
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 10, 0, 6.283, 0, Math.PI / 2), port); nose.rotation.x = Math.PI / 2; nose.position.z = 2.05; g.add(nose);
  const light = new THREE.PointLight(0xffe2a8, 8, 18, 1.8); light.position.z = 2.6; g.add(light);
  const beam = new THREE.Mesh(new THREE.ConeGeometry(2, 9, 24, 1, true), rayMat(0xffe9b8, 0.5, 1)); beam.rotation.x = -Math.PI / 2; beam.position.z = 2.2 + 4.5; g.add(beam);
  g.userData.prop = prop; return shadow(g);
}
function makeBell() {
  const g = new THREE.Group(); const prof = [[0, 1.6], [0.5, 1.6], [0.9, 1.4], [1.2, 0.9], [1.35, 0.2], [1.5, -0.6], [1.6, -0.8], [1.45, -0.8]].map(([x, y]) => new THREE.Vector2(x, y));
  g.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 32), brass));
  const port = new THREE.MeshStandardMaterial({ color: 0, emissive: 0xffc77a, emissiveIntensity: 1.5 });
  for (let k = 0; k < 4; k++) { const a = (k / 4) * 6.283; const c = new THREE.Mesh(new THREE.CircleGeometry(0.22, 16), port); c.position.set(Math.cos(a) * 1.38, 0.3, Math.sin(a) * 1.38); c.lookAt(Math.cos(a) * 3, 0.3, Math.sin(a) * 3); g.add(c); }
  const chain = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 1.6, 0), new THREE.Vector3(0, 60, 0)]); g.add(new THREE.Line(chain, new THREE.LineBasicMaterial({ color: 0x2c3a3c })));
  const l = new THREE.PointLight(0xffc77a, 6, 12, 1.8); l.position.y = -0.4; g.add(l);
  g.userData.prop = null; return shadow(g);
}
const vessels = [
  { o: makeSub(0x8a5a2b), R: 62, y: 15, w: 0.035, p: 0 },
  { o: makeSub(0x56636b), R: 76, y: 22, w: -0.025, p: 2.4 },
  { o: makeBell(), R: 56, y: 10, w: 0.018, p: 4.2 },
];
vessels.forEach((v) => scene.add(v.o));

// ---------- Faune : bancs de poissons et raie manta ----------
const fishGeo = (() => {
  const s = new THREE.Shape(); s.moveTo(1, 0); s.quadraticCurveTo(0.3, 0.42, -0.6, 0.08); s.lineTo(-1, 0.32); s.lineTo(-0.88, 0); s.lineTo(-1, -0.32); s.lineTo(-0.6, -0.08); s.quadraticCurveTo(0.3, -0.42, 1, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.1, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.05, bevelSegments: 2, curveSegments: 8 }); g.center(); g.rotateY(-Math.PI / 2); g.scale(0.5, 0.5, 0.5); return g;
})();
const fishMat = new THREE.MeshStandardMaterial({ color: 0xa8d4e0, metalness: 0.35, roughness: 0.35, emissive: 0x0a2030 });
fishMat.onBeforeCompile = (sh) => { sh.uniforms.uTime = U.time; sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;').replace('#include <begin_vertex>', '#include <begin_vertex>\ntransformed.x += sin(uTime * 12.0 + float(gl_InstanceID) * 0.7 + position.z * 5.0) * 0.12 * max(0.0, 0.25 - position.z);'); };
fishMat.customProgramCacheKey = () => 'fish';
const schools = [0, 1, 2].map((k) => {
  const n = 45, mesh = new THREE.InstancedMesh(fishGeo, fishMat, n); mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); mesh.frustumCulled = false; scene.add(mesh);
  return { mesh, offs: Array.from({ length: n }, () => new THREE.Vector3(rand(-4, 4), rand(-1.5, 1.5), rand(-4, 4))), R: 50 + k * 14, y: 11 + k * 6, w: (0.07 + k * 0.02) * (k % 2 ? -1 : 1), p: k * 2.1, s: 0.8 + k * 0.3 };
});
const dummy = new THREE.Object3D(), tmp = new THREE.Vector3();
const schoolPos = (s, t, o, out) => { const a = t * s.w + s.p; return out.set(Math.cos(a) * s.R + o.x + Math.sin(t * 0.7 + o.y * 3) * 0.6, s.y + Math.sin(a * 2) * 4 + o.y, Math.sin(a) * s.R + o.z + Math.cos(t * 0.6 + o.x * 2) * 0.6); };
const manta = (() => {
  const geo = new THREE.PlaneGeometry(2, 1, 36, 18); const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const u = p.getX(i), v = p.getY(i) + 0.5, span = 6 * Math.sin(Math.PI * Math.pow(v, 1.36)); p.setXYZ(i, u * span, (1 - u * u) * 0.45 * Math.sin(Math.PI * v), (v - 0.5) * 5 - Math.abs(u) * span * 0.3); }
  geo.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({ color: 0x1f3540, roughness: 0.8, side: THREE.DoubleSide });
  m.onBeforeCompile = (sh) => { sh.uniforms.uTime = U.time; sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;').replace('#include <begin_vertex>', '#include <begin_vertex>\nfloat ax = abs(position.x); transformed.y += sin(uTime * 1.3 - ax * 0.45) * ax * 0.22;'); };
  m.customProgramCacheKey = () => 'manta';
  const g = new THREE.Group(); g.add(new THREE.Mesh(geo, m));
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.08, 5, 6), m); tail.rotation.x = -Math.PI / 2; tail.position.z = -4.8; g.add(tail);
  scene.add(shadow(g)); return g;
})();

// ---------- Bulles, neige marine, plancton ----------
for (let i = 0; i < 7; i++) { // cheminées qui bullent sur le fond
  const a = Math.random() * 6.283, r = rand(22, 90), x = Math.cos(a) * r, z = Math.sin(a) * r, y = ground(x, z);
  const ch = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 1, rand(1.5, 3), 8), reefRock); ch.position.set(x, y + 0.6, z); scene.add(shadow(ch)); emitters.push({ x, y: y + 2, z, w: 0.6 });
}
function particles(n, color, size, spread, yMin, yMax, { map = glowTex, additive = true, opacity = 1 } = {}) {
  const pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * spread; pos.set([Math.cos(a) * r, rand(yMin, yMax), Math.sin(a) * r], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color, size, map, transparent: true, opacity, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending })); pts.frustumCulled = false; scene.add(pts); return pts;
}
const snow = particles(2400, 0xcfe8e0, 0.18, 140, 0, 60, { additive: false, opacity: 0.7 });
const plankton = particles(600, 0x5ff7ff, 0.4, 110, 0.3, 5);
const bubbles = particles(700, 0xdff8ff, 0.5, 1, 0, 1, { map: bubbleTex, additive: false, opacity: 0.85 });
const bData = Array.from({ length: 700 }, () => ({}));
function resetBubble(i, initial) {
  const e = emitters[i % emitters.length], d = bData[i]; Object.assign(d, { e, sp: rand(1.5, 4), ph: rand(0, 6.28), x0: e.x + rand(-e.w, e.w), z0: e.z + rand(-e.w, e.w) });
  bubbles.geometry.attributes.position.setY(i, e.y + (initial ? rand(0, 55) : 0));
}
bData.forEach((_, i) => resetBubble(i, true));

// ---------- Rendu ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.6, 0.6));
composer.addPass(new OutputPass());
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime; U.time.value = t;
  jellies.forEach((j) => animateJelly(j, t));
  claude.position.y = T + 22 + Math.sin(t * 0.6) * 0.8; claude.rotation.y += dt * 0.05;
  const beat = 1 + 0.1 * Math.pow(Math.max(Math.sin(t * 2.4), 0), 8); heart.scale.setScalar(beat); heart.rotation.y += dt * 0.3; heartLight.intensity = 34 + beat * 8;
  orbs.forEach((o, i) => { const a = t * (0.4 + i * 0.07) + i; o.position.set(Math.cos(a) * (3 + i * 0.4), T + 4.4 + Math.sin(t + i * 2) * 1.6, Math.sin(a) * (3 + i * 0.4)); });
  divers.forEach(({ agent, diver, arms, helmet }, i) => {
    const run = agent.status === 'running', fail = agent.status === 'failed';
    diver.position.y = 0.5 + Math.sin(t * 1.2 + i) * (run ? 0.04 : 0.1);
    arms.forEach((a, j) => (a.rotation.x = run ? Math.sin(t * 7 + j * 2) * 0.18 : fail ? -0.9 : 0.5));
    helmet.rotation.x = fail ? 0.35 : Math.sin(t * 0.8 + i) * 0.05;
  });
  anemones.forEach(({ light, agent, i0 }, i) => {
    light.intensity = agent.status === 'failed' ? i0 * (Math.random() < 0.08 ? 0.15 : 0.9 + Math.random() * 0.3) : agent.status === 'running' ? i0 * (0.75 + Math.sin(t * 2.5 + i) * 0.25) : i0;
  });
  pulses.forEach(({ s, curve, off, agent }) => {
    const sp = agent.status === 'running' ? 0.22 : agent.status === 'completed' ? 0.05 : 0;
    curve.getPointAt(((t * sp + off) % 1 + 1) % 1, s.position); s.material.opacity = agent.status === 'failed' ? 0.4 + 0.6 * Math.max(0, Math.sin(t * 6 + off * 6)) : 1;
  });
  sessions.forEach((s, i) => { const a = s.a + t * 0.04; s.j.position.set(Math.cos(a) * s.r, s.y + Math.sin(t * 0.7 + i) * 1.2, Math.sin(a) * s.r); });
  vessels.forEach((v, i) => {
    const a = t * v.w + v.p; v.o.position.set(Math.cos(a) * v.R, v.y + Math.sin(t * 0.5 + i) * 0.6, Math.sin(a) * v.R);
    if (v.o.userData.prop) { v.o.rotation.y = -a + (v.w < 0 ? Math.PI : 0); v.o.rotation.z = Math.sin(t * 0.4 + i) * 0.05; v.o.userData.prop.rotation.z += dt * 4; } else v.o.rotation.y += dt * 0.05;
  });
  schools.forEach((s) => { s.offs.forEach((o, i) => { schoolPos(s, t, o, dummy.position); schoolPos(s, t + 0.1, o, tmp); dummy.lookAt(tmp); dummy.scale.setScalar(s.s * (0.8 + (i % 5) * 0.08)); dummy.updateMatrix(); s.mesh.setMatrixAt(i, dummy.matrix); }); s.mesh.instanceMatrix.needsUpdate = true; });
  { const a = t * 0.03; manta.position.set(Math.cos(a) * 85, 30 + Math.sin(t * 0.3) * 3, Math.sin(a) * 85); manta.rotation.set(0, -a, -0.25); }
  const bp = bubbles.geometry.attributes.position;
  for (let i = 0; i < bp.count; i++) { const d = bData[i]; const y = bp.getY(i) + dt * d.sp; if (y > d.e.y + 55) { resetBubble(i); continue; } bp.setXYZ(i, d.x0 + Math.sin(t * 2 + d.ph) * 0.25, y, d.z0 + Math.cos(t * 1.7 + d.ph) * 0.25); }
  bp.needsUpdate = true;
  const sp = snow.geometry.attributes.position;
  for (let i = 0; i < sp.count; i++) { let y = sp.getY(i) - dt * (0.25 + (i % 7) * 0.05); if (y < 0) y = 60; sp.setY(i, y); sp.setX(i, sp.getX(i) + Math.sin(t * 0.3 + i) * dt * 0.15); }
  sp.needsUpdate = true;
  snow.rotation.y += dt * 0.004; plankton.rotation.y -= dt * 0.01; plankton.material.opacity = 0.6 + Math.sin(t * 0.9) * 0.3;
  controls.update(); composer.render(); labelRenderer.render(scene, camera);
});
</script>
</body>
</html>
