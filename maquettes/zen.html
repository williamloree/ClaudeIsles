const V3 = THREE.Vector3;

// Toit japonais : cône polygonal concave, coins relevés.
function roofGeo(R, h, sides, rot = 0, lift = 0.3) {
  const geo = new THREE.ConeGeometry(R, h, sides * 8, 6, true); const p = geo.attributes.position, seg = Math.PI * 2 / sides;
  for (let i = 0; i < p.count; i++) {

// ---------- Ciel nocturne, lune, étoiles, montagnes ----------
scene.add(new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: { top: { value: new THREE.Color(0x01030a) }, mid: { value: new THREE.Color(0x0a1426) }, hor: { value: new THREE.Color(FOG) }, md: { value: moonDir } },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 hor; uniform vec3 md; varying vec3 vP; void main(){ vec3 d = normalize(vP); float h = d.y; vec3 c = h < 0.15 ? mix(hor, mid, smoothstep(-0.02, 0.15, h)) : mix(mid, top, smoothstep(0.15, 0.7, h)); c += vec3(0.10, 0.13, 0.2) * pow(max(dot(d, md), 0.0), 24.0); gl_FragColor = vec4(c, 1.0); }',

{
  const n = 1800, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const u = rnd(0, 6.283), h = 0.06 + Math.pow(Math.random(), 0.8) * 0.94, q = Math.sqrt(1 - h * h); pos.set([Math.cos(u) * q * 2000, h * 2000, Math.sin(u) * q * 2000], i * 3); }

  ctx.restore(); return tex(c);
})();
const moonDisc = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex, color: new THREE.Color(1.5, 1.5, 1.45), fog: false, transparent: true, depthWrite: false }));
moonDisc.position.copy(moonDir).multiplyScalar(1600); moonDisc.scale.setScalar(110); scene.add(moonDisc);

// ---------- L'étang ----------
const waterNormals = (() => {
  const N = 256, [c, ctx] = cv(N, N); const img = ctx.createImageData(N, N);
  const waves = Array.from({ length: 14 }, (_, i) => ({ kx: Math.round(Math.cos(i * 2.4) * (2 + i)), ky: Math.round(Math.sin(i * 2.4) * (2 + i)), a: 1 / (2 + i), p: i * 1.7 }));
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let dx = 0, dy = 0; for (const w of waves) { const c2 = Math.cos(2 * Math.PI * (w.kx * x + w.ky * y) / N + w.p) * w.a; dx += c2 * w.kx; dy += c2 * w.ky; }
    const n = new V3(-dx * 0.06, -dy * 0.06, 1).normalize(); const i = (y * N + x) * 4;
    img.data[i] = (n.x * 0.5 + 0.5) * 255; img.data[i + 1] = (n.y * 0.5 + 0.5) * 255; img.data[i + 2] = (n.z * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
  }

})();
const water = new Water(new THREE.PlaneGeometry(600, 600), {

// ---------- Berges : sable ratissé (karesansui), rochers, haies, forêt ----------
const SAND_IN = 86, SAND_R = 175, GY = 0.5;
const BANK = Array.from({ length: 16 }, (_, i) => { const a = (i / 16) * 6.283 + rnd(-0.08, 0.08); return { a, kind: i === 8 ? 'torii' : i % 2 ? 'rocks' : i % 4 ? 'sakura' : 'maple', r: i % 2 ? rnd(115, 150) : rnd(100, 132) }; });
const rockSpots = BANK.filter((b) => b.kind === 'rocks').map((b) => ({ x: Math.cos(b.a) * b.r, z: Math.sin(b.a) * b.r, r: rnd(2.6, 4.2) }));
const sandTex = (() => {
  const S = 2048, [c, ctx] = cv(S, S), k = S / (2 * SAND_R), BASE = '#aaa395';
  ctx.fillStyle = BASE; ctx.fillRect(0, 0, S, S);

  const rake = (x, y, r) => { ctx.strokeStyle = 'rgba(55,50,44,0.6)'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.stroke(); ctx.strokeStyle = 'rgba(255,250,236,0.35)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(x, y, r + 2.2, 0, 6.283); ctx.stroke(); };
  for (let r = SAND_IN + 0.6; r < SAND_R; r += 0.9) rake(S / 2, S / 2, r * k);

    const x = (s.x / SAND_R + 1) * S / 2, y = (s.z / SAND_R + 1) * S / 2;
    ctx.fillStyle = BASE; ctx.beginPath(); ctx.arc(x, y, (s.r + 4.2) * k, 0, 6.283); ctx.fill();

const sand = new THREE.Mesh(new THREE.RingGeometry(SAND_IN, SAND_R, 160, 4), new THREE.MeshStandardMaterial({ map: sandTex, bumpMap: sandTex, bumpScale: 2, roughness: 1 }));
sand.rotation.x = -Math.PI / 2; sand.position.y = GY; sand.receiveShadow = true; scene.add(sand);

instanced(rockGeos[1], stone, 230, (d, i) => { const a = (i / 230) * 6.283 + rnd(-0.01, 0.01), r = rnd(85, 88.5), s = rnd(0.7, 2); d.position.set(Math.cos(a) * r, 0.2, Math.sin(a) * r); d.scale.set(s * rnd(0.9, 1.4), s * 0.55, s); d.rotation.set(0, rnd(0, 6.3), 0); });

// ---------- Feu ----------

// ---------- Tōrō (lanterne de pierre) ----------
function makeToro(s, color, lightI = 0) {

  lines.forEach((l, i) => { ctx.fillStyle = i === lines.length - 1 ? '#0e0c0a' : '#4a4034'; ctx.fillText(l, 62, 330 + i * 36); });
  ctx.fillStyle = '#1b1612'; ctx.fillRect(62, 330 + lines.length * 36 - 15, 11, 18);
  ctx.fillStyle = '#b3261e'; ctx.fillRect(392, 724, 52, 52); ctx.fillStyle = '#f3e6c8'; ctx.font = '700 34px "Shippori Mincho"'; ctx.textAlign = 'center'; ctx.fillText('禅', 418, 762);
  return tex(c);
}
function makeKakemono(sh) {
  const g = new THREE.Group();
  for (const x of [-1.5, 1.5]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.16, 5.3, 0.16), wood); p.position.set(x, 2.65, 0); g.add(p); }
  const beam = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.16, 0.2), wood); beam.position.y = 5.05; g.add(beam);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.1, 0.8), lacquer); cap.position.y = 5.32; cap.rotation.z = 0; g.add(cap);
  const pivot = new THREE.Group(); pivot.position.set(0, 4.92, 0.08); g.add(pivot);
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.6, 8), wood); rod.rotation.z = Math.PI / 2; pivot.add(rod);
  const t = kakemonoTexture(sh);
  const paper = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 4.12), new THREE.MeshStandardMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.5, roughness: 0.9, side: THREE.DoubleSide })); paper.position.y = -2.1; pivot.add(paper);
  const jiku = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.6, 10), lacquer); jiku.rotation.z = Math.PI / 2; jiku.position.y = -4.2; pivot.add(jiku);
  for (const x of [-1.36, 1.36]) { const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.14, 12), brass); knob.rotation.z = Math.PI / 2; knob.position.set(x, -4.2, 0); pivot.add(knob); }
  kakemonos.push(pivot);

}
SHELLS.forEach((sh, i) => {
  const a = Math.PI / 2 + (i - 1) * 1.01, x = Math.cos(a) * 12, z = Math.sin(a) * 12;
  const k = makeKakemono(sh); k.position.set(x, T, z); k.lookAt(x * 3, T, z * 3); hub.add(k);
});

// ---------- Îlots des agents ----------
AGENTS.forEach((agent, i) => {
  const angle = Math.PI / 2 + (i - 1.5) * (Math.PI / 3.1);
  const dist = 38 + (i % 2) * 7;
  const pos = new V3(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
  const isl = makeIslet(7, 5 + i * 2.7); isl.position.copy(pos); scene.add(isl);
  const top = isl.userData.top, loc = (a, d) => new V3(Math.cos(a) * d, top, Math.sin(a) * d);
  const monk = makeMonk(agent); monk.position.y = top; monk.rotation.y = -angle + Math.PI / 2; isl.add(monk);
  const [label, color] = STATUS[agent.status];
  const lan = makeToro(1.0, color, 10); lan.position.copy(loc(angle + 1.2, 3.7)); isl.add(lan);
  const tr = tree(rnd(5, 6.5), ['maple', 'pine', 'sakura', 'pine'][i]); tr.position.copy(loc(angle - 1.2, 4.4)); isl.add(tr);
  for (const [a, d, s] of [[-0.15, 5.3, 1.1], [2.45, 4.9, 0.8], [-2.45, 5, 0.9], [0.4, 5.6, 0.5]]) { const r = rock(s); r.position.copy(loc(angle + a, d)); isl.add(r); }
  const dir = pos.clone().normalize();
  const a = dir.clone().multiplyScalar(14.6); a.y = T + 0.05;
  const b = pos.clone().sub(dir.clone().multiplyScalar(6)); b.y = top + 0.05;
  scene.add(makeBridge(a, b));
  const el = document.createElement('div'); el.className = 'label';
  el.innerHTML = `<div class="kind">ESPRIT · ${agent.type}<span class="pill" style="background:${color}">${label}</span></div><div class="title">${agent.title}</div><div class="sub">${agent.time} · ${agent.tools} outils</div>${agent.status === 'running' ? `<div class="act">${agent.activity}</div>` : ''}`;
  const obj = new CSS2DObject(el); obj.position.set(0, top + 4.6, 0); isl.add(obj);
});

// ---------- Carpes koï sous l'eau ----------
function koiTexture(seed) {
  const [c, ctx] = cv(128, 64); ctx.fillStyle = seed % 3 === 0 ? '#e8501a' : '#f1ece2'; ctx.fillRect(0, 0, 128, 64);
  for (let k = 0; k < 5; k++) { ctx.fillStyle = seed % 3 === 0 ? '#f6e8d8' : '#e4561d'; ctx.beginPath(); ctx.ellipse(rnd(0, 128), rnd(10, 54), rnd(8, 22), rnd(6, 14), rnd(0, 3), 0, 6.283); ctx.fill(); }
  if (seed % 2) for (let k = 0; k < 4; k++) { ctx.fillStyle = '#141414'; ctx.beginPath(); ctx.arc(rnd(0, 128), rnd(10, 54), rnd(3, 7), 0, 6.283); ctx.fill(); }
  return tex(c);
}
const koiBody = new THREE.SphereGeometry(1, 20, 14), koiTail = new THREE.PlaneGeometry(0.6, 0.55), koiFin = new THREE.PlaneGeometry(0.34, 0.2);
const kois = Array.from({ length: 12 }, (_, i) => {
  const t = koiTexture(i), mat = new THREE.MeshStandardMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.35, roughness: 0.5, side: THREE.DoubleSide });
  const g = new THREE.Group(); const body = new THREE.Mesh(koiBody, mat); body.scale.set(0.3, 0.2, 1); g.add(body);
  const tail = new THREE.Group(); tail.position.z = -0.9; const fin = new THREE.Mesh(koiTail, mat); fin.rotation.x = -Math.PI / 2; fin.position.z = -0.25; tail.add(fin); g.add(tail);
  for (const s of [-1, 1]) { const pf = new THREE.Mesh(koiFin, mat); pf.rotation.x = -Math.PI / 2; pf.position.set(s * 0.36, -0.03, 0.3); g.add(pf); }
  g.scale.setScalar(rnd(1.1, 1.7)); scene.add(g);
  return { g, body, tail, r: rnd(24, 76), sp: rnd(0.035, 0.08) * (i % 2 ? 1 : -1), ph: rnd(0, 6.283), y: rnd(-0.6, -0.3) };
});

// ---------- Tōrō nagashi : anciens agents qui dérivent ----------
function nagashiTexture(name) {
  const [c, ctx] = cv(128, 144); const g = ctx.createRadialGradient(64, 80, 10, 64, 72, 90); g.addColorStop(0, '#fff2cf'); g.addColorStop(1, '#e8a75a'); ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 144);
  ctx.strokeStyle = '#5a3a1e'; ctx.lineWidth = 6; ctx.strokeRect(3, 3, 122, 138);
  ctx.fillStyle = '#9e2a1c'; ctx.font = '700 58px "Shippori Mincho"'; ctx.textAlign = 'center'; ctx.fillText('灯', 64, 84);
  ctx.fillStyle = '#4a3420'; ctx.font = '600 10px Inter'; ctx.fillText(name.slice(0, 22), 64, 122); return tex(c);
}
const poolMat = new THREE.MeshBasicMaterial({ map: glowTex, color: 0xffa24d, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false });
const drift = ANCIENS.map((name, i) => {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.16, 1.1), wood); base.position.y = 0.08; g.add(base);
  const paper = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.8), new THREE.MeshStandardMaterial({ color: 0, emissive: 0xffffff, emissiveMap: nagashiTexture(name), emissiveIntensity: 1.25 })); paper.position.y = 0.61; g.add(paper);
  for (const [x, z] of [[-0.42, -0.42], [0.42, -0.42], [-0.42, 0.42], [0.42, 0.42]]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.0, 0.06), wood); p.position.set(x, 0.62, z); g.add(p); }
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), poolMat); pool.rotation.x = -Math.PI / 2; pool.position.y = 0.04; pool.renderOrder = 1; g.add(pool);
  scene.add(g);
  return { g, r: [57, 61, 65, 77, 80, 59][i], sp: rnd(0.012, 0.02) * (i % 3 ? 1 : 1.2), ph: i * 1.05 + rnd(0, 0.4) };
});

// ---------- Sessions : lanternes de papier au-dessus du hub ----------
function chochinTexture(s) {
  const [c, ctx] = cv(512, 256); ctx.fillStyle = '#f4dfb2'; ctx.fillRect(0, 0, 512, 256);
  for (let y = 0; y < 256; y += 14) { ctx.fillStyle = 'rgba(120,80,40,0.35)'; ctx.fillRect(0, y, 512, 2); }
  ctx.textAlign = 'center';
  for (const x of [128, 384]) { ctx.fillStyle = '#b3261e'; ctx.font = '700 70px "Shippori Mincho"'; ctx.fillText('灯', x, 128); ctx.fillStyle = '#2a1a12'; ctx.font = '700 28px "Shippori Mincho"'; ctx.fillText(s.name, x, 186); }
  return tex(c);
}
const chochinGeo = new THREE.LatheGeometry(Array.from({ length: 13 }, (_, k) => new THREE.Vector2(0.42 + Math.sin((k / 12) * Math.PI) * 0.28, (k / 12) * 1.3 - 0.65)), 28);
const chochins = SESSIONS.map((s, i) => {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(chochinGeo, new THREE.MeshStandardMaterial({ color: 0, emissive: 0xffffff, emissiveMap: chochinTexture(s), emissiveIntensity: 1.15, side: THREE.DoubleSide })));
  for (const y of [-0.68, 0.68]) { const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.1, 20), lacquer); cap.position.y = y; g.add(cap); }
  const el = document.createElement('div'); el.className = 'label mini'; el.innerHTML = `<div class="kind">SESSION</div><div class="title">${s.name}</div><div class="sub">${s.where}</div>`;
  const obj = new CSS2DObject(el); obj.position.y = 1.7; g.add(obj);
  g.scale.setScalar(1.25); scene.add(g);
  return { g, ph: (i / SESSIONS.length) * 6.283 };
});

// ---------- Lucioles, brume, pétales ----------
const flies = Array.from({ length: 90 }, () => {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xd8ff7a, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.setScalar(0.6); scene.add(s);
  const a = rnd(0, 6.283), r = Math.random() < 0.4 ? rnd(80, 100) : rnd(15, 75);
  return { s, b: new V3(Math.cos(a) * r, rnd(1, 6), Math.sin(a) * r), w: rnd(0.2, 0.5), bl: rnd(0.8, 2), ph: rnd(0, 6.283) };
});
const mist = new THREE.Group();
for (let i = 0; i < 80; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x9fb4d0, transparent: true, opacity: 0.09, depthWrite: false })); const a = rnd(0, 6.283), r = rnd(10, 110); s.position.set(Math.cos(a) * r, rnd(0.6, 2.2), Math.sin(a) * r); s.scale.set(rnd(18, 38), rnd(4, 8), 1); mist.add(s); }
scene.add(mist);
scene.updateMatrixWorld(true);
const crowns = trees.filter((t) => t.userData.petal).flatMap((t) => t.userData.crown.map((p) => ({ p: t.localToWorld(p.clone()), c: t.userData.petal })));
const NP = 900, petals = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.22, 0.14), new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.8, emissive: 0x2a1018 }), NP);
petals.frustumCulled = false; scene.add(petals);
const P = Array.from({ length: NP }, () => ({ p: new V3(), r: new THREE.Euler(), v: 1, w: 1 })), pcol = new THREE.Color();
function spawnPetal(i, init = false) {
  const s = crowns[(Math.random() * crowns.length) | 0], q = P[i];
  q.p.copy(s.p).add(new V3(rnd(-2.5, 2.5), rnd(-1, 1), rnd(-2.5, 2.5))); if (init) q.p.y = rnd(0.5, s.p.y);
  q.v = rnd(0.5, 1.1); q.w = rnd(1, 3); q.r.set(rnd(0, 6), rnd(0, 6), rnd(0, 6));
  petals.setColorAt(i, pcol.set(s.c).offsetHSL(0, 0, rnd(-0.08, 0.08)));
}
for (let i = 0; i < NP; i++) spawnPetal(i, true);

// ---------- Rendu ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.6, 0.6));
composer.addPass(new OutputPass());
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock(), nxt = new V3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
  water.material.uniforms.time.value += dt * 0.3;
  flames.forEach((f, i) => {
    if (f.isPointLight) { f.intensity = f.intensity * 0.8 + (f.userData.i0 ??= f.intensity) * (0.8 + Math.random() * 0.4) * 0.2; return; }
    const k = f.userData.base * (0.85 + Math.sin(t * 9 + i * 1.7) * 0.12 + Math.random() * 0.05); f.scale.set(k * 0.8, k * 1.6, 1);
  });
  hubGlow.material.opacity = 0.5 + Math.sin(t * 2.3) * 0.06;
  monks.forEach(({ agent, body, neck, arms, halo }, i) => {
    const run = agent.status === 'running', fail = agent.status === 'failed';
    body.scale.y = 1 + Math.sin(t * 1.4 + i) * 0.015;
    arms[1].rotation.x = run ? -0.45 + Math.sin(t * 6 + i) * 0.1 : fail ? -1.1 : -0.85; arms[1].rotation.y = run ? Math.sin(t * 2.7 + i) * 0.18 : 0;
    arms[0].rotation.x = run ? -0.55 : fail ? -1.1 : -0.85;
    neck.rotation.x = fail ? -0.45 : run ? -0.2 + Math.sin(t * 0.8 + i) * 0.04 : -0.05;
    halo.scale.setScalar(run ? 1 + Math.sin(t * 3 + i) * 0.06 : 1);
  });
  kakemonos.forEach((p, i) => (p.rotation.x = Math.sin(t * 0.8 + i * 1.3) * 0.03));
  kois.forEach((k) => {
    const pos = (a) => { const r = k.r + Math.sin(a * 3 + k.ph) * 4; return [Math.cos(a) * r, Math.sin(a) * r]; };
    const a = k.ph + t * k.sp, [x, z] = pos(a), [x2, z2] = pos(a + 0.02 * Math.sign(k.sp));
    k.g.position.set(x, k.y, z); k.g.lookAt(nxt.set(x2, k.y, z2));
    k.tail.rotation.y = Math.sin(t * 7 + k.ph) * 0.5; k.body.rotation.y = Math.sin(t * 7 + k.ph - 1) * 0.08;
  });
  drift.forEach((d, i) => { const a = d.ph + t * d.sp; d.g.position.set(Math.cos(a) * d.r, 0.05 + Math.sin(t * 1.3 + i) * 0.05, Math.sin(a) * d.r); d.g.rotation.y = a * 0.7; d.g.rotation.z = Math.sin(t + i) * 0.04; });
  chochins.forEach((c, i) => { const a = c.ph + t * 0.08; c.g.position.set(Math.cos(a) * 16, T + 9 + i * 2.5 + Math.sin(t * 0.9 + i * 2) * 0.5, Math.sin(a) * 16); c.g.rotation.y = t * 0.15 + i; c.g.rotation.z = Math.sin(t * 0.7 + i) * 0.05; });
  flies.forEach((f) => { f.s.position.set(f.b.x + Math.sin(t * f.w + f.ph) * 1.5, f.b.y + Math.sin(t * f.w * 1.3 + f.ph) * 0.6, f.b.z + Math.cos(t * f.w * 0.8 + f.ph) * 1.5); f.s.material.opacity = 0.1 + 0.9 * Math.max(0, Math.sin(t * f.bl + f.ph)) ** 3; });
  for (let i = 0; i < NP; i++) {
    const q = P[i]; q.p.y -= dt * q.v; q.p.x += dt * (0.5 + Math.sin(t * 0.7 + i) * 0.5); q.p.z += dt * Math.cos(t * 0.5 + i * 0.3) * 0.4; q.r.x += dt * q.w; q.r.y += dt * q.w * 0.7;
    if (q.p.y < 0.1) spawnPetal(i);
    dummy.position.copy(q.p); dummy.rotation.copy(q.r); dummy.scale.setScalar(1); dummy.updateMatrix(); petals.setMatrixAt(i, dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true; petals.instanceColor.needsUpdate = true;
  mist.rotation.y -= dt * 0.006;
  controls.update(); composer.render(); labelRenderer.render(scene, camera);
});
