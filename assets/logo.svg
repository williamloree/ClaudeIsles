<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Claude Isles</title>
  <defs>
    <radialGradient id="nuit" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#16302f"/>
      <stop offset="0.6" stop-color="#081413"/>
      <stop offset="1" stop-color="#030607"/>
    </radialGradient>
    <linearGradient id="eau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2a26"/>
      <stop offset="1" stop-color="#03100d"/>
    </linearGradient>
    <linearGradient id="basalte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f42"/>
      <stop offset="1" stop-color="#15181a"/>
    </linearGradient>
    <linearGradient id="marbre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9ab92"/>
      <stop offset="0.5" stop-color="#efe4cc"/>
      <stop offset="1" stop-color="#a99a80"/>
    </linearGradient>
    <linearGradient id="flamme" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="0.55" stop-color="#ff9a4d"/>
      <stop offset="1" stop-color="#ffe2a8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a4d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disque"><circle cx="128" cy="128" r="120"/></clipPath>
  </defs>

  <g clip-path="url(#disque)">
    <rect width="256" height="256" fill="url(#nuit)"/>
    <!-- voûte de la caverne -->
    <path d="M0 0h256v18l-8 14-6-10-7 26-6-24-9 12-6-16-8 8-5-10-9 22-7-20-8 6-6-12-10 30-7-28-6 8-8-10-7 16-6-14-9 10-6-12-8 24-6-22-8 8-7-14-9 18-6-16-10 12-6-10-8 20-7-18-8 6-6-10-9 28-6-24V0z" fill="#0b1514"/>
    <!-- braises -->
    <g fill="#ffb35c">
      <circle cx="104" cy="66" r="1.8" opacity="0.8"/>
      <circle cx="150" cy="58" r="1.5" opacity="0.7"/>
      <circle cx="160" cy="80" r="1.2" opacity="0.6"/>
      <circle cx="94" cy="84" r="1.2" opacity="0.6"/>
      <circle cx="140" cy="40" r="1.4" opacity="0.5"/>
      <circle cx="116" cy="34" r="1.1" opacity="0.4"/>
    </g>
    <!-- le Styx -->
    <rect y="168" width="256" height="88" fill="url(#eau)"/>
    <!-- halo de la flamme -->
    <circle cx="128" cy="92" r="70" fill="url(#halo)"/>
    <!-- reflet de la flamme sur l'eau -->
    <path d="M118 178h20M114 188h28M120 198h16M124 208h8" stroke="#ff9a4d" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

    <!-- îlots des agents et leurs ponts -->
    <path d="M58 166q20-22 40-8" fill="none" stroke="#d9cbb0" stroke-width="3" stroke-linecap="round"/>
    <path d="M198 166q-20-22-40-8" fill="none" stroke="#d9cbb0" stroke-width="3" stroke-linecap="round"/>
    <path d="M36 170q4-12 22-12t22 12z" fill="url(#basalte)"/>
    <path d="M176 170q4-12 22-12t22 12z" fill="url(#basalte)"/>
    <circle cx="52" cy="152" r="4.5" fill="#6fd6ff"/>
    <circle cx="204" cy="152" r="4.5" fill="#ffc94d"/>
    <circle cx="52" cy="152" r="10" fill="#6fd6ff" opacity="0.25"/>
    <circle cx="204" cy="152" r="10" fill="#ffc94d" opacity="0.25"/>

    <!-- îlot central -->
    <path d="M80 172q6-22 48-22t48 22z" fill="url(#basalte)"/>
    <!-- tholos -->
    <rect x="96" y="144" width="64" height="6" rx="1" fill="url(#marbre)"/>
    <rect x="100" y="139" width="56" height="6" rx="1" fill="url(#marbre)"/>
    <g fill="url(#marbre)">
      <rect x="103" y="108" width="7" height="31"/>
      <rect x="117" y="108" width="7" height="31"/>
      <rect x="132" y="108" width="7" height="31"/>
      <rect x="146" y="108" width="7" height="31"/>
    </g>
    <rect x="98" y="101" width="60" height="7" rx="1" fill="url(#marbre)"/>
    <path d="M96 101q32-22 64 0z" fill="#6b4630"/>

    <!-- la flamme éternelle -->
    <path d="M128 52c14 16 20 28 14 40c-3 6-8 9-14 9s-11-3-14-9c-6-12 0-24 14-40z" fill="url(#flamme)"/>
    <path d="M128 70c6 8 9 14 6 20c-1 3-3.5 4.5-6 4.5s-5-1.5-6-4.5c-3-6 0-12 6-20z" fill="#fff4dc"/>
    <rect x="120" y="98" width="16" height="4" rx="2" fill="#7a5528"/>
  </g>
  <circle cx="128" cy="128" r="119" fill="none" stroke="#a8844f" stroke-width="4"/>
</svg>
